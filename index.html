<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semiconductor Physics Interactive Simulator</title>
<style>
/* ============================================================
   SEMICONDUCTOR PHYSICS SIMULATOR — GLOBAL DESIGN SYSTEM
   ============================================================ */
:root{
  --bg1:#0a0a1a; --bg2:#1a1a3e; --bg3:#0d0d2b;
  --accent:#00f0ff; --accent2:#ff006e; --accent3:#ffbe0b;
  --success:#00ff88; --warning:#ff8800;
  --text:#e8e8ff; --text2:rgba(232,232,255,.6);
  --panel:rgba(15,15,40,.85); --border:rgba(255,255,255,.1);
  --track:#2a2a4a; --readout-bg:rgba(10,10,30,.7);
  --nav-bg:rgba(10,10,30,.75);
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --radius:14px;
}
body.light{
  --bg1:#eef2fa; --bg2:#dde6f7; --bg3:#cfdcf5;
  --text:#0e1024; --text2:rgba(14,16,40,.64);
  --panel:rgba(255,255,255,.9); --border:rgba(14,16,40,.16);
  --track:#c2cae4; --readout-bg:rgba(248,250,255,.95);
  --nav-bg:rgba(255,255,255,.85);
  --shadow:0 8px 26px rgba(30,40,90,.12);
}
body.light .panel-head h2{background:linear-gradient(90deg,#008fa8,#7a0080); -webkit-background-clip:text; background-clip:text; color:transparent}
body.light .readout .r-value,body.light .formula .fv,body.light .slider-head .val{filter:brightness(.72) saturate(1.3)}
body.light .readout .r-value{color:#0b1030 !important}
body.light .formula .fv{color:#0b1030}
body.light .slider-head .val{color:#0089a3}
body.light .big-value{color:#a06a00; text-shadow:none}
body.light .segmented button.active{color:#006b7d}
body.light .pill.active{color:#007a90}
body.light canvas.viz{filter:none}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(600px 400px at 15% 10%, rgba(0,240,255,.07), transparent 60%),
    radial-gradient(700px 500px at 85% 80%, rgba(255,0,110,.06), transparent 60%),
    radial-gradient(500px 350px at 70% 15%, rgba(255,190,11,.05), transparent 60%);
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent),var(--accent2));border-radius:6px}

/* ---------- NAV BAR ---------- */
nav{
  position:fixed; top:0; left:0; right:0; height:60px; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px; gap:12px;
  background:var(--nav-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.logo{
  font-size:1.05rem; font-weight:800; letter-spacing:.3px; white-space:nowrap;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.chapter-tabs{display:flex; gap:8px; align-items:center}
.chapter-tab{
  padding:7px 16px; border-radius:20px; font-size:.82rem; font-weight:600;
  border:1px solid var(--border); color:var(--text2); background:transparent;
  cursor:pointer; transition:all .25s; white-space:nowrap;
}
.chapter-tab.active{color:#06121a; background:linear-gradient(90deg,var(--accent),#7df9ff); border-color:transparent; box-shadow:0 0 18px rgba(0,240,255,.45)}
.chapter-tab.disabled{opacity:.38; cursor:not-allowed}
.nav-actions{display:flex; gap:8px; align-items:center}
.icon-btn{
  width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
  background:var(--panel); color:var(--text); font-size:1.05rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .2s;
}
.icon-btn:hover{border-color:var(--accent); box-shadow:0 0 12px rgba(0,240,255,.35)}

/* ---------- TOPIC PILL BAR ---------- */
.pill-bar{
  position:fixed; top:60px; left:0; right:0; z-index:99;
  display:flex; gap:8px; padding:10px 16px; overflow-x:auto; scrollbar-width:none;
  background:var(--nav-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.pill-bar::-webkit-scrollbar{display:none}
.pill{
  position:relative; flex:0 0 auto; padding:8px 16px; border-radius:22px;
  font-size:.82rem; font-weight:600; color:var(--text2); cursor:pointer;
  border:1px solid var(--border); background:var(--panel); transition:all .25s; user-select:none;
}
.pill:hover{color:var(--text); transform:translateY(-1px)}
.pill.active{
  color:var(--accent); border-color:var(--accent);
  box-shadow:0 0 16px rgba(0,240,255,.35), inset 0 0 12px rgba(0,240,255,.08);
}
.pill.active::after{
  content:''; position:absolute; left:14px; right:14px; bottom:-11px; height:3px;
  border-radius:3px; background:linear-gradient(90deg,var(--accent),var(--accent2));
  box-shadow:0 0 10px var(--accent);
}

/* ---------- PANELS ---------- */
main{position:relative; z-index:1; padding:128px 16px 60px; max-width:1560px; margin:0 auto}
.panel{display:none; animation:panelIn .45s cubic-bezier(.2,.8,.3,1)}
.panel.active{display:block}
@keyframes panelIn{from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none}}
.panel-head{margin-bottom:16px}
.panel-head h2{
  font-size:clamp(1.3rem,3vw,1.9rem); font-weight:800; letter-spacing:.3px;
  background:linear-gradient(90deg,var(--accent),#9be8ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.panel-head p{color:var(--text2); font-size:.92rem; margin-top:4px; max-width:900px}
.sim-grid{
  display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:stretch;
}
.card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); box-shadow:var(--shadow);
}
.canvas-wrap{padding:12px; display:flex; flex-direction:column}
.canvas-title{
  font-size:.8rem; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
  color:var(--text2); padding:2px 4px 10px; display:flex; justify-content:space-between; align-items:center;
}
.canvas-title .live-dot{color:var(--success); font-size:.72rem; letter-spacing:.5px}
canvas.viz{
  width:100%; min-height:400px; height:520px; border-radius:10px; display:block;
  background:linear-gradient(160deg, rgba(8,8,26,.9), rgba(16,16,48,.9));
  border:1px solid var(--border);
}
.controls{padding:16px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; max-height:700px}
.controls h3{font-size:.78rem; letter-spacing:1.4px; text-transform:uppercase; color:var(--text2)}

/* ---------- CUSTOM SLIDER ---------- */
.slider-block{display:flex; flex-direction:column; gap:5px}
.slider-head{display:flex; justify-content:space-between; align-items:baseline; font-size:.82rem}
.slider-head label{color:var(--text2); font-weight:600}
.slider-head .val{font-family:'JetBrains Mono','Consolas',monospace; color:var(--accent); font-weight:700; font-size:.85rem}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:4px;
  background:transparent; outline:none; cursor:pointer; position:relative; z-index:2;
}
input[type=range]::-webkit-slider-runnable-track{height:6px; border-radius:4px; background:transparent}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
  background:#fff; border:3px solid var(--accent); margin-top:-7px;
  box-shadow:0 0 12px var(--accent), 0 2px 6px rgba(0,0,0,.5); transition:transform .15s;
}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:6px; border-radius:4px; background:var(--track)}
input[type=range]::-moz-range-progress{height:6px; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent2))}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:#fff; border:3px solid var(--accent);
  box-shadow:0 0 12px var(--accent);
}
input[type=range]:disabled{opacity:.35; cursor:not-allowed}
input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:4px}
.slider-fill{position:absolute; left:0; top:0; height:6px; border-radius:4px; background:linear-gradient(90deg,var(--accent),var(--accent2)); pointer-events:none; z-index:1; box-shadow:0 0 10px rgba(0,240,255,.35)}
.slider-track-wrap{position:relative; border-radius:4px; background:var(--track); height:6px}
.big-value{
  text-align:center; font-family:'JetBrains Mono',monospace; font-size:1.5rem; font-weight:800;
  color:var(--accent3); text-shadow:0 0 18px rgba(255,190,11,.4); padding:4px 0 2px;
}

/* ---------- TOGGLE ---------- */
.toggle-row{display:flex; align-items:center; gap:10px; font-size:.85rem; color:var(--text2); font-weight:600; cursor:pointer; user-select:none}
.toggle{position:relative; width:50px; height:26px; flex:0 0 auto}
.toggle input{opacity:0; width:0; height:0; position:absolute}
.toggle .track{
  position:absolute; inset:0; border-radius:20px; background:#3a3a5c; transition:background .3s; cursor:pointer;
}
.toggle .knob{
  position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
  background:#fff; transition:transform .3s cubic-bezier(.4,1.6,.4,1); box-shadow:0 2px 5px rgba(0,0,0,.4);
}
.toggle input:checked + .track{background:linear-gradient(90deg,var(--accent),var(--accent2)); box-shadow:0 0 12px rgba(0,240,255,.4)}
.toggle input:checked + .track .knob{transform:translateX(24px)}
.toggle input:focus-visible + .track{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- SEGMENTED CONTROL ---------- */
.segmented{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.segmented button{
  flex:1; padding:8px 4px; font-size:.76rem; font-weight:700; cursor:pointer;
  background:transparent; color:var(--text2); border:none; transition:all .2s;
}
.segmented button + button{border-left:1px solid var(--border)}
.segmented button.active{background:linear-gradient(90deg,rgba(0,240,255,.25),rgba(255,0,110,.25)); color:var(--accent); text-shadow:0 0 8px rgba(0,240,255,.6)}
.segmented button:hover:not(.active){color:var(--text)}

/* ---------- SELECT ---------- */
select{
  width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--readout-bg); color:var(--text); font-size:.85rem; font-weight:600; cursor:pointer;
}
select:focus-visible{outline:2px solid var(--accent)}

/* ---------- READOUT BOXES ---------- */
.readouts{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.readout{
  background:var(--readout-bg); border:1px solid var(--border); border-radius:8px;
  padding:8px 10px; transition:border-color .3s;
}
.readout .r-label{font-size:.64rem; letter-spacing:.8px; text-transform:uppercase; color:var(--text2); font-weight:700}
.readout .r-value{font-family:'JetBrains Mono',monospace; font-size:1.02rem; font-weight:700; margin-top:2px; word-break:break-all}
.readout.pulse{animation:pulse .4s}
@keyframes pulse{0%{border-color:var(--accent); box-shadow:0 0 14px rgba(0,240,255,.4)} 100%{border-color:var(--border); box-shadow:none}}
.readout.wide{grid-column:1 / -1}

/* ---------- FORMULA BAR ---------- */
.formula-bar{
  margin-top:16px; padding:14px 18px; display:flex; flex-wrap:wrap; gap:10px 26px;
  align-items:center; justify-content:center;
}
.formula{
  font-family:'JetBrains Mono',monospace; font-size:clamp(.8rem,1.8vw,1rem); font-weight:600;
  padding:8px 14px; border-radius:9px; background:var(--readout-bg); border:1px solid var(--border);
  transition:all .3s;
}
.formula.active{border-color:var(--accent3); box-shadow:0 0 16px rgba(255,190,11,.3)}
.formula .hl-c{color:var(--accent)} .formula .hl-m{color:var(--accent2)} .formula .hl-a{color:var(--accent3)} .formula .hl-g{color:var(--success)}
.formula .fv{color:var(--text); font-weight:800}

/* ---------- ACCORDION ---------- */
.accordion{margin-top:16px; overflow:hidden}
.accordion-head{
  width:100%; padding:15px 18px; display:flex; justify-content:space-between; align-items:center;
  background:transparent; border:none; color:var(--text); font-size:.95rem; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.accordion-head .chev{transition:transform .3s; color:var(--accent)}
.accordion.open .accordion-head .chev{transform:rotate(180deg)}
.accordion-body{max-height:0; overflow:hidden; transition:max-height .45s cubic-bezier(.2,.8,.3,1)}
.accordion-body-inner{padding:4px 20px 18px; color:var(--text2); font-size:.88rem; line-height:1.65}
.accordion-body-inner ul{padding-left:20px; display:flex; flex-direction:column; gap:6px}
.accordion-body-inner li::marker{color:var(--accent)}
.accordion-body-inner b{color:var(--text)}

/* ---------- REDUCED MOTION ---------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}

/* ---------- RESPONSIVE ---------- */
@media (max-width:1024px){
  .sim-grid{grid-template-columns:1fr}
  .controls{max-height:none}
  canvas.viz{height:440px; min-height:340px}
}
@media (max-width:768px){
  .logo{font-size:.85rem}
  .chapter-tabs .chapter-tab{padding:6px 10px; font-size:.72rem}
  canvas.viz{height:380px; min-height:300px}
  main{padding-top:124px}
}
@media (max-width:640px){
  .chapter-tab.disabled{display:none}
  .chapter-tabs .chapter-tab{padding:6px 10px; font-size:.7rem}
  .nav-actions .icon-btn{width:34px;height:34px;font-size:.95rem}
  main{padding-top:122px; padding-left:10px; padding-right:10px}
  .pill{padding:7px 12px; font-size:.76rem}
  .panel-head p{font-size:.85rem}
  .controls{padding:14px}
  canvas.viz{height:400px; min-height:320px}
}
@media (max-width:480px){
  .logo{display:none}
  .chapter-tabs .chapter-tab{padding:5px 8px; font-size:.62rem}
  .readouts{grid-template-columns:1fr 1fr}
  .formula-bar{gap:8px; padding:12px}
  .formula{font-size:.74rem; padding:7px 10px}
  canvas.viz{height:360px; min-height:300px}
  .panel-head h2{font-size:1.15rem}
}
</style>
</head>
<body>

<!-- ============ NAV BAR ============ -->
<nav>
  <div class="logo">⚛️ Semiconductor Physics Simulator</div>
  <div class="chapter-tabs">
    <button class="chapter-tab active" data-chapter="1">Chapter 1: Semiconductor Physics</button>
    <button class="chapter-tab disabled" title="Coming soon">Chapter 2</button>
    <button class="chapter-tab disabled" title="Coming soon">Chapter 3</button>
  </div>
  <div class="nav-actions">
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
    <button class="icon-btn" id="fsBtn" title="Fullscreen" aria-label="Fullscreen">⛶</button>
  </div>
</nav>

<!-- ============ TOPIC PILL BAR ============ -->
<div class="pill-bar" id="pillBar" role="tablist" aria-label="Chapter 1 topics"></div>

<main id="main"></main>

<script>
'use strict';
/* ============================================================
   PHYSICS CONSTANTS
   ============================================================ */
const PHYSICS = {
  k_B: 1.380649e-23, k_B_eV: 8.617333e-5, e: 1.602176634e-19,
  h: 6.62607015e-34, c: 2.998e8, m_0: 9.1093837015e-31,
  epsilon_0: 8.854187817e-12, epsilon_Si: 11.7,
  Eg_Si: 1.12, Eg_Ge: 0.67, Eg_GaAs: 1.43, Eg_CdTe: 1.45, Eg_diamond: 5.47,
  ni_Si_300K: 1.5e10, ni_Ge_300K: 2.4e13, ni_GaAs_300K: 2.1e6,
  NC_Si: 2.8e19, NV_Si: 1.04e19, NC_Ge: 1.04e19, NV_Ge: 4.04e18,
  NC_GaAs: 4.7e17, NV_GaAs: 7.4e18,
};
const MATERIALS = {
  Si:   { Eg:1.12, ni:1.5e10, NC:2.8e19, NV:1.04e19, eps:11.7, mue:1350, muh:480,  mh_me:1.6,  lambda_g:1107 },
  Ge:   { Eg:0.67, ni:2.4e13, NC:1.04e19, NV:4.04e18, eps:16.0, mue:3900, muh:1900, mh_me:1.2,  lambda_g:1850 },
  GaAs: { Eg:1.43, ni:2.1e6,  NC:4.7e17, NV:7.4e18,  eps:12.9, mue:8500, muh:400,  mh_me:12.0, lambda_g:867 },
  CdTe: { Eg:1.45, ni:1.0e6,  NC:2.0e18, NV:2.0e18,  eps:10.2, mue:1000, muh:80,   mh_me:2.0,  lambda_g:855 },
};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmtSci=(v,d=2)=>{ if(!isFinite(v)||v===0) return '0'; const e=Math.floor(Math.log10(Math.abs(v))); const m=v/Math.pow(10,e); return m.toFixed(d)+'×10'+sup(e); };
const sup=n=>String(n).split('').map(c=>({'−':'⁻','-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'}[c]||c)).join('');
const fmt=(v,d=3)=>{ if(!isFinite(v)) return '∞'; if(Math.abs(v)>=1e6||(Math.abs(v)<0.001&&v!==0)) return fmtSci(v); return v.toFixed(d); };
function niAt(T, mat){ const m=MATERIALS[mat]; if(T<=0) return 0; return m.ni*Math.pow(T/300,1.5)*Math.exp(-(m.Eg/(2*PHYSICS.k_B_eV))*(1/T-1/300)); }
function NCAt(T, mat){ return MATERIALS[mat].NC*Math.pow(Math.max(T,1)/300,1.5); }
function NVAt(T, mat){ return MATERIALS[mat].NV*Math.pow(Math.max(T,1)/300,1.5); }
function wavelengthToColor(nm){
  let r,g,b;
  if(nm<440){r=-(nm-440)/60;b=1;g=0;} else if(nm<490){g=(nm-440)/50;r=0;b=1;}
  else if(nm<510){g=1;b=-(nm-510)/20;r=0;} else if(nm<580){r=(nm-510)/70;g=1;b=0;}
  else if(nm<645){r=1;g=-(nm-645)/65;b=0;} else {r=1;g=0;b=0;}
  const f=nm>700?0.3+0.7*(700-nm)/80*0+0.3:1;
  const gamma=nm>700?0.3:1;
  return `rgb(${Math.round(255*clamp(r,0,1)*gamma)},${Math.round(255*clamp(g,0,1)*gamma)},${Math.round(255*clamp(b,0,1)*gamma)})`;
}

/* ============================================================
   STATE — single source of truth for all topics
   ============================================================ */
const state = {
  t1:{ dist:1.0, material:'semi', temp:300 },
  t2:{ T:300, EF:0, show1mf:true, showWidth:true, showFill:true },
  t3:{ doping:'intrinsic', ND:1e16, NA:1e16, T:300, material:'Si' },
  t4:{ I:50, B:1.0, carrier:'n', d:1.0, n:1e17, speed:1 },
  t5:{ V:0, T:300, NA:1e16, ND:1e16, showCarriers:true, showCharge:true, showIV:true, showEfield:false },
  t6:{ G:1000, lambda:550, RL:50, T:300, material:'Si' },
  t7:{ E:100, mue:1350, muh:480, n:1e16, p:1e16, preset:'Si', showE:true, showH:true, showLattice:true, showVectors:true, showThermal:true },
};

/* ============================================================
   CANVAS INFRASTRUCTURE (DPR-aware, responsive)
   ============================================================ */
const canvases = {}; // id -> {canvas, ctx, w, h}
function setupCanvas(canvas){
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return { canvas, ctx, w:rect.width, h:rect.height };
}
function refreshCanvases(){
  for(const id in canvases){ const c=canvases[id]; if(!c.canvas.offsetParent && c.canvas.closest('.panel') && !c.canvas.closest('.panel').classList.contains('active')) continue; Object.assign(c, setupCanvas(c.canvas)); }
}
new ResizeObserver(()=>refreshCanvases()).observe(document.body);
window.addEventListener('resize', refreshCanvases);

/* ============================================================
   UI COMPONENT BUILDERS
   ============================================================ */
const main = document.getElementById('main');
const pillBar = document.getElementById('pillBar');

function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; }

function buildSlider(parent, {label, min, max, step, value, unit='', format, onInput, id, disabled}){
  const wrap = el('div','slider-block');
  const head = el('div','slider-head');
  const lab = el('label',null,label); lab.htmlFor=id;
  const val = el('span','val');
  head.append(lab,val);
  const trackWrap = el('div','slider-track-wrap');
  const input = el('input'); input.type='range'; input.id=id; input.min=min; input.max=max; input.step=step; input.value=value;
  if(disabled) input.disabled=true;
  input.setAttribute('aria-label', label);
  const fill = el('div','slider-fill');
  trackWrap.append(fill,input);
  wrap.append(head,trackWrap);
  parent.append(wrap);
  const fmtFn = format || (v=>`${v} ${unit}`.trim());
  function sync(){
    val.textContent = fmtFn(parseFloat(input.value));
    const pct = (input.value-min)/(max-min)*100;
    fill.style.width = pct+'%';
  }
  input.addEventListener('input', ()=>{ sync(); onInput(parseFloat(input.value)); });
  sync();
  return { input, setValue(v){ input.value=v; sync(); } };
}

function buildToggle(parent, {label, checked, onChange}){
  const row = el('label','toggle-row');
  const t = el('span','toggle');
  const input = el('input'); input.type='checkbox'; input.checked=checked;
  const track = el('span','track'); const knob = el('span','knob');
  track.append(knob); t.append(input,track);
  const lab = el('span',null,label);
  row.append(t,lab); parent.append(row);
  input.addEventListener('change', ()=>onChange(input.checked));
  return input;
}

function buildSegmented(parent, {options, value, onChange}){
  const seg = el('div','segmented');
  const btns = {};
  options.forEach(o=>{
    const b = el('button', o.value===value?'active':'', o.label);
    b.type='button';
    b.addEventListener('click', ()=>{
      Object.values(btns).forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); onChange(o.value);
    });
    btns[o.value]=b; seg.append(b);
  });
  parent.append(seg);
  return { set(v){ Object.values(btns).forEach(x=>x.classList.remove('active')); if(btns[v]) btns[v].classList.add('active'); } };
}

function buildSelect(parent, {label, options, value, onChange}){
  const wrap = el('div','slider-block');
  const lab = el('label',null,label); lab.style.cssText='font-size:.82rem;color:var(--text2);font-weight:600';
  const sel = el('select');
  options.forEach(o=>{ const op=el('option',null,o.label); op.value=o.value; if(o.value===value) op.selected=true; sel.append(op); });
  sel.addEventListener('change', ()=>onChange(sel.value));
  wrap.append(lab,sel); parent.append(wrap);
  return sel;
}

function buildReadouts(parent, defs){
  const grid = el('div','readouts');
  const map = {};
  defs.forEach(d=>{
    const box = el('div','readout'+(d.wide?' wide':''));
    box.append(el('div','r-label',d.label));
    const v = el('div','r-value', d.value||'—');
    v.style.color = d.color||'var(--accent)';
    box.append(v); grid.append(box);
    map[d.id]={box, val:v, last:''};
  });
  parent.append(grid);
  return {
    set(id, text){
      const r = map[id]; if(!r) return;
      if(r.val.textContent !== text){
        r.val.textContent = text;
        if(r.last && !isNaN(parseFloat(r.last)) && !isNaN(parseFloat(text))){
          const a=parseFloat(r.last), b=parseFloat(text);
          if(a!==0 && Math.abs(b-a)/Math.abs(a) > 0.25){ r.box.classList.remove('pulse'); void r.box.offsetWidth; r.box.classList.add('pulse'); }
        }
        r.last = text;
      }
    }
  };
}

   ============================================================ */
const THEORY = {
  t1:`<ul>
    <li><b>Pauli exclusion principle:</b> no two electrons share the same quantum state, so when atoms approach, each level splits into N closely-spaced states (N = number of atoms).</li>
    <li><b>N atoms → N levels → band:</b> the splitting is tiny compared with the level spacing, giving quasi-continuous <b>valence</b> and <b>conduction</b> bands.</li>
    <li><b>Equilibrium lattice constant a₀:</b> the distance where the total energy is minimum; bands have their natural widths there.</li>
    <li><b>Band gap Eᵍ</b> decides classification: Eᵍ = 0 (metal), 0.5–2.5 eV (semiconductor), &gt; 3 eV (insulator).</li>
    <li>Typical gaps: <b>Si = 1.12 eV</b>, Ge = 0.67 eV, GaAs = 1.43 eV, Diamond = 5.47 eV.</li>
    <li>Higher temperature promotes more electrons across the gap: nᵢ ∝ exp(−Eᵍ/2kT).</li></ul>`,
  t2:`<ul>
    <li>At <b>T = 0 K</b> every state below E<sub>F</sub> is filled (f = 1) and every state above is empty (f = 0) — a perfect step.</li>
    <li>At <b>T &gt; 0</b> thermal energy kT excites some electrons above E<sub>F</sub> and leaves holes below.</li>
    <li><b>f(E<sub>F</sub>) = 0.5</b> at every temperature — the Fermi level is the 50 % occupation point.</li>
    <li><b>Symmetry:</b> f(E<sub>F</sub>+ΔE) + f(E<sub>F</sub>−ΔE) = 1 for any ΔE.</li>
    <li>kT ≈ <b>0.0259 eV</b> at 300 K; the smearing width is roughly ±2kT (≈ ±5kT for 1 %–99 % transition).</li>
    <li>The tail above E<sub>F</sub> is the population of thermally excited electrons that carry current.</li></ul>`,
  t3:`<ul>
    <li><b>Intrinsic:</b> E<sub>F</sub> sits near mid-gap, shifted slightly by the effective-mass ratio: E<sub>F</sub> = (E<sub>C</sub>+E<sub>V</sub>)/2 + ¾kT·ln(m*<sub>h</sub>/m*<sub>e</sub>).</li>
    <li><b>N-type doping</b> (donors) pushes E<sub>F</sub> toward E<sub>C</sub>: E<sub>F</sub> ≈ E<sub>C</sub> − kT·ln(N<sub>C</sub>/N<sub>D</sub>).</li>
    <li><b>P-type doping</b> (acceptors) pulls E<sub>F</sub> toward E<sub>V</sub>: E<sub>F</sub> ≈ E<sub>V</sub> + kT·ln(N<sub>V</sub>/N<sub>A</sub>).</li>
    <li><b>Mass-action law:</b> n·p = nᵢ² holds at any doping and temperature (equilibrium).</li>
    <li>As T rises, nᵢ grows exponentially and E<sub>F</sub> drifts back to mid-gap — the material becomes <b>intrinsic-like</b> near Tᵢ.</li>
    <li>Donor level E<sub>D</sub> ≈ E<sub>C</sub> − 0.05 eV (Si:P); acceptor level E<sub>A</sub> ≈ E<sub>V</sub> + 0.05 eV (Si:B).</li></ul>`,
  t4:`<ul>
    <li>Current I<sub>x</sub> in a magnetic field B<sub>z</sub> deflects carriers via the <b>Lorentz force</b> F = q(v × B).</li>
    <li>Charge piles up on one face until the Hall field E<sub>H</sub> exactly cancels the magnetic force: qE<sub>H</sub> = qv<sub>d</sub>B.</li>
    <li><b>Hall voltage:</b> V<sub>H</sub> = IB/(ned) — inversely proportional to carrier density and thickness.</li>
    <li><b>Sign of V<sub>H</sub> reveals carrier type:</b> negative for electrons (n-type), positive for holes (p-type).</li>
    <li>Hall coefficient R<sub>H</sub> = −1/(ne) for n-type, +1/(pe) for p-type.</li>
    <li>At equilibrium F<sub>B</sub> = F<sub>E</sub> and carriers flow straight again.</li></ul>`,
  t5:`<ul>
    <li>The <b>built-in potential</b> V₀ = (kT/e)·ln(N<sub>A</sub>N<sub>D</sub>/nᵢ²) bends the bands across the junction.</li>
    <li><b>Forward bias</b> lowers the barrier to e(V₀−V), shrinking the depletion width and allowing exponential current.</li>
    <li><b>Reverse bias</b> raises the barrier to e(V₀+|V|), widening depletion; only the small saturation current I₀ flows.</li>
    <li>Diode law: <b>I = I₀[exp(eV/ηkT) − 1]</b>, with ideality factor η ≈ 1.</li>
    <li>Depletion width W = √[2ε(V₀−V)(1/N<sub>A</sub>+1/N<sub>D</sub>)/e].</li>
    <li>Under bias the single Fermi level splits into quasi-Fermi levels E<sub>Fn</sub> and E<sub>Fp</sub> separated by eV.</li></ul>`,
  t6:`<ul>
    <li>A photon is absorbed only if <b>hν ≥ Eᵍ</b> (λ ≲ 1107 nm for Si); sub-gap photons pass through.</li>
    <li>Absorption creates an <b>electron–hole pair</b>; the built-in field sweeps electrons to the n-side, holes to the p-side.</li>
    <li>Short-circuit current I<sub>sc</sub> ∝ light intensity G; open-circuit voltage V<sub>oc</sub> = (kT/e)·ln(I<sub>L</sub>/I₀+1).</li>
    <li>Maximum power P<sub>max</sub> = V<sub>mp</sub>·I<sub>mp</sub> occurs at the knee of the I–V curve.</li>
    <li><b>Fill factor</b> FF = P<sub>max</sub>/(I<sub>sc</sub>·V<sub>oc</sub>) measures how "square" the I–V curve is.</li>
    <li><b>Efficiency</b> η = P<sub>max</sub>/(A·G) — the fraction of incident optical power converted to electricity.</li></ul>`,
  t7:`<ul>
    <li>Without a field, carriers execute <b>random thermal motion</b> — net current is zero.</li>
    <li>An electric field superposes a <b>drift velocity</b> v<sub>d</sub> = μE: electrons drift against E, holes along E.</li>
    <li><b>Conductivity:</b> σ = e(nμ<sub>e</sub> + pμ<sub>h</sub>) — each carrier type contributes independently.</li>
    <li><b>Current density:</b> J = σE = J<sub>e</sub> + J<sub>h</sub>.</li>
    <li>Scattering (phonons, impurities) limits drift: v<sub>d</sub> = eEτ/m* = μE.</li>
    <li>Resistivity ρ = 1/σ; high mobility and high carrier density both raise conductivity.</li></ul>`,
};

/* ============================================================
   TOPIC 1 — ENERGY BANDS
   Real band formation physics for Si-like crystal:
   - discrete atomic levels at large separation
   - levels broaden into bands as a -> a0 (tight-binding-like exponential)
   - valence band top / conduction band bottom split by Eg at a0
   ============================================================ */
const T1_LEVELS = [
  { name:'1s', E:-13.6, w:0.05, color:'#4da6ff' },   // core level, resists splitting
  { name:'2s', E:-3.40, w:0.18, color:'#00d4aa' },
  { name:'2p', E:-3.18, w:0.26, color:'#7ee081' },
  { name:'3s', E:-1.58, w:0.42, color:'#ffb84d' },
  { name:'3p', E:-1.24, w:0.52, color:'#ff8c42' },
  { name:'3d', E:-0.62, w:0.40, color:'#ff5e62' },
];
const t1 = { readouts:null, particles:[], time:0 };
function t1Eg(){
  const m = state.t1.material;
  if(m==='metal') return 0;
  if(m==='insulator') return 5.47;
  return 1.12;
}
/* Gap grows as atoms separate; at a = a0 it equals the selected material gap.
   Compression (a -> 0.5 a0) narrows the gap, foreshadowing pressure metallisation. */
function t1GapNow(){
  const d = state.t1.dist;
  const base = t1Eg();
  if(base===0) return 0;
  const f = 0.30 + 0.70*clamp((d-0.5)/0.5,0,1);
  return base*f;
}
function t1BandWidths(){
  const d = state.t1.dist;
  const grow = 1/(1+Math.exp((d-2.2)*1.5));   // ~1 near a0, ~0 far away
  return { vb: 0.30 + 2.10*grow, cb: 0.24 + 1.55*grow, grow };
}
function t1Update(dt){
  t1.time += dt;
  const T = state.t1.temp, Eg = t1Eg();
  const kT = PHYSICS.k_B_eV*Math.max(T,1);
  const ni = Math.sqrt(2.8e19*1.04e19) * Math.exp(-Eg/(2*kT));
  const nCB = state.t1.material==='metal' ? 999 : Math.round(clamp(ni/2e9, 0, 999));
  t1.readouts.set('eg', t1Eg().toFixed(2)+' eV');
  const bw = t1BandWidths();
  t1.readouts.set('vbw', bw.vb.toFixed(2)+' eV');
  t1.readouts.set('cbw', bw.cb.toFixed(2)+' eV');
  t1.readouts.set('ncb', String(nCB));
  const f1 = document.getElementById('f1-ni');
  if(f1) f1.innerHTML = `n<sub>i</sub> = √(N<sub>C</sub>N<sub>V</sub>)·e<sup>−E<sub>g</sub>/2kT</sup> = <span class="fv">${fmtSci(ni)}</span> cm<sup>−3</sup>`;
  const fe = document.getElementById('f1-eg');
  if(fe) fe.innerHTML = `<span class="fv">${t1Eg().toFixed(2)} eV</span>`;
  if(t1.particles.length < 80 && Math.random()<0.6)
    t1.particles.push({ x:Math.random(), y:Math.random(), ph:Math.random()*6.28, sp:0.4+Math.random() });
  t1.particles.forEach(p=>{ p.y += dt*0.06*p.sp; if(p.y>1){ p.y=0; p.x=Math.random(); } });
}

function t1Render(){
  const c = canvases['t1']; if(!c) return;
  const { ctx, w, h } = c;
  ctx.clearRect(0,0,w,h);

  const narrow = w < 620;
  const padL=58, padR=narrow?54:96, padT=76, padB=76;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const _bw0 = t1BandWidths(), _gap0 = t1GapNow();
  const EvTop0 = -1.20;
  const Emin = -4.4;
  const Emax = Math.max(1.25, EvTop0 + _gap0 + _bw0.cb + 0.55);
  const X = d => padL + (d-0.5)/(5-0.5)*plotW;
  const Y = E => padT + (Emax-E)/(Emax-Emin)*plotH;

  // ---- energy grid ----
  ctx.font='10px JetBrains Mono,monospace';
  const gridStep = (Emax-Emin) > 7 ? 2 : 1;
  for(let E=Math.ceil(Emin);E<=Emax;E+=gridStep){
    ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.setLineDash([3,6]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,Y(E)); ctx.lineTo(padL+plotW,Y(E)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='rgba(232,232,255,.45)'; ctx.textAlign='right';
    ctx.fillText(E+' ', padL-8, Y(E)+3);
  }
  ctx.save(); ctx.translate(padL-32, padT+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.fillStyle='rgba(232,232,255,.55)'; ctx.font='10px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('Energy (eV)', 0, 0); ctx.restore();

  // ---- title / material banner ----
  const mNames={metal:'METAL — bands overlap, no band gap', semi:'SEMICONDUCTOR — Si, Eᵍ ≈ 1.12 eV', insulator:'INSULATOR — diamond, Eᵍ ≈ 5.5 eV'};
  const mCol={metal:'#00ff88', semi:'#00f0ff', insulator:'#ffbe0b'};
  ctx.textAlign='left'; ctx.font='bold 13px Inter,sans-serif';
  ctx.fillStyle=mCol[state.t1.material];
  ctx.fillText(mNames[state.t1.material], padL, 26);

  // ---- x axis ----
  ctx.fillStyle='rgba(232,232,255,.55)'; ctx.font='11px Inter,sans-serif';
  ctx.textAlign='left'; ctx.fillText('compressed', padL, h-34);
  ctx.textAlign='right'; ctx.fillText('isolated atoms', padL+plotW, h-34);
  ctx.textAlign='center'; ctx.fillStyle='rgba(232,232,255,.4)'; ctx.font='10px Inter,sans-serif';
  if(!narrow) ctx.fillText('interatomic distance a →', padL+plotW/2, h-16);

  // ---- equilibrium marker ----
  const xa0 = X(1);
  ctx.strokeStyle='rgba(0,240,255,.55)'; ctx.setLineDash([5,5]); ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(xa0,padT-6); ctx.lineTo(xa0,padT+plotH); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#00f0ff'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('a₀', xa0, padT-12);

  // ---- bands: broadened levels ----
  const steps=100;
  const hwOf = (wmax,d) => wmax*(1/(1+Math.exp((d-2.3)*1.45)));
  T1_LEVELS.forEach(lv=>{
    if(lv.name==='1s') return;   // drawn off-scale below
    const wmax = lv.w*2.2;
    ctx.beginPath();
    for(let i=0;i<=steps;i++){
      const d=0.5+(5-0.5)*i/steps, x=X(d), hw=hwOf(wmax,d);
      if(i===0) ctx.moveTo(x, Y(lv.E+hw)); else ctx.lineTo(x, Y(lv.E+hw));
    }
    for(let i=steps;i>=0;i--){
      const d=0.5+(5-0.5)*i/steps, x=X(d), hw=hwOf(wmax,d);
      ctx.lineTo(x, Y(lv.E-hw));
    }
    ctx.closePath();
    const g=ctx.createLinearGradient(X(0.5),0,X(5),0);
    g.addColorStop(0, lv.color+'45'); g.addColorStop(.55, lv.color+'22'); g.addColorStop(1, lv.color+'00');
    ctx.fillStyle=g; ctx.fill();
    ctx.strokeStyle=lv.color+'80'; ctx.lineWidth=1; ctx.stroke();

    // discrete level at large separation
    ctx.strokeStyle=lv.color; ctx.lineWidth=2.6;
    ctx.beginPath(); ctx.moveTo(X(4.62),Y(lv.E)); ctx.lineTo(X(5),Y(lv.E)); ctx.stroke();
    ctx.fillStyle=lv.color; ctx.font='bold 11px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillText(lv.name, X(5)+7, Y(lv.E)+4);
  });

  // ---- 1s off-scale strip ----
  const stripY = h-58;
  ctx.fillStyle='rgba(77,166,255,.10)'; ctx.fillRect(padL, stripY, plotW, 12);
  ctx.strokeStyle='rgba(77,166,255,.75)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(padL,stripY+6); ctx.lineTo(padL+plotW,stripY+6); ctx.stroke();
  ctx.fillStyle='rgba(232,232,255,.4)'; ctx.font='9px JetBrains Mono,monospace'; ctx.textAlign='center';
  ctx.fillText(narrow ? '1s core (off-scale)' : '1s core level (−13.6 eV, off-scale) — barely broadens', padL+plotW/2, stripY-5);
  ctx.fillStyle='#4da6ff'; ctx.textAlign='left';
  ctx.fillText('1s', padL+plotW+7, stripY+9);

  // ---- equilibrium callout: VB / CB / gap ----
  const bw=t1BandWidths(), gap=t1GapNow();
  const EvTop=-1.20, EcBot=EvTop+gap;
  const cx = X(1);
  // narrow hatch strip centred on a0
  if(gap>0.04){
    const hx0=cx-34, hx1=cx+34;
    ctx.save(); ctx.beginPath(); ctx.rect(hx0,Y(EcBot),hx1-hx0,Y(EvTop)-Y(EcBot)); ctx.clip();
    ctx.strokeStyle='rgba(255,190,11,.45)'; ctx.lineWidth=1;
    for(let x=hx0-30;x<hx1+30;x+=7){ ctx.beginPath(); ctx.moveTo(x,Y(EvTop)+4); ctx.lineTo(x+22,Y(EcBot)-4); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle='rgba(255,190,11,.8)'; ctx.lineWidth=1.2;
    ctx.strokeRect(hx0,Y(EcBot),hx1-hx0,Y(EvTop)-Y(EcBot));
  }
  // conduction band fill at a0 (height fixed, top edge = E_C)
  const cbTopY = Y(EcBot + bw.cb);
  if(gap <= 0.04){
    // METAL — VB and CB merge into one partially-filled band
    const mergedTop = Y(EvTop + bw.cb*0.9);
    const gm = ctx.createLinearGradient(0, mergedTop, 0, Y(EvTop-bw.vb));
    gm.addColorStop(0,'rgba(0,255,136,.30)');
    gm.addColorStop(.45,'rgba(0,240,255,.30)');
    gm.addColorStop(1,'rgba(0,212,170,.05)');
    ctx.fillStyle=gm; ctx.fillRect(cx-40, mergedTop, 80, Y(EvTop-bw.vb)-mergedTop);
    ctx.strokeStyle='#00ff88'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-40,mergedTop); ctx.lineTo(cx+40,mergedTop); ctx.stroke();
    ctx.fillStyle='rgba(0,255,136,.9)'; ctx.font='bold 9px JetBrains Mono,monospace'; ctx.textAlign='center';
    ctx.fillText('partially filled', cx, mergedTop-6);
  }
  if(gap > 0.04){
    const gcb = ctx.createLinearGradient(0, Y(EcBot), 0, cbTopY);
    gcb.addColorStop(0,'rgba(255,140,66,.42)'); gcb.addColorStop(1,'rgba(255,140,66,.04)');
    ctx.fillStyle=gcb; ctx.fillRect(cx-34, cbTopY, 68, Y(EcBot)-cbTopY);
    ctx.strokeStyle='rgba(255,140,66,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-34,cbTopY); ctx.lineTo(cx+34,cbTopY); ctx.stroke();
  }

  // E_C / E_V ticks at a0 (skipped for metals, where the bands merge)
  ctx.strokeStyle='#00d4aa'; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(cx-40,Y(EvTop)); ctx.lineTo(cx+40,Y(EvTop)); ctx.stroke();
  if(gap>0.04){
    ctx.strokeStyle='#ff8c42';
    ctx.beginPath(); ctx.moveTo(cx-40,Y(EcBot)); ctx.lineTo(cx+40,Y(EcBot)); ctx.stroke();
  }
  ctx.fillStyle='#ff8c42'; ctx.font='bold 10px JetBrains Mono,monospace'; ctx.textAlign='left';
  if(gap>0.04){
    ctx.fillText('E_C', cx+44, Y(EcBot)+4);
    ctx.fillStyle='#00d4aa'; ctx.fillText('E_V', cx+44, Y(EvTop)+4);
  }

  // callout labels with dark backdrops
  const chip=(text,bx,by,col,align)=>{
    ctx.font='bold 11px Inter,sans-serif';
    const tw=ctx.measureText(text).width;
    const px = align==='center' ? bx-tw/2 : bx;
    ctx.fillStyle='rgba(8,8,26,.85)';
    ctx.fillRect(px-6, by-12, tw+12, 18);
    ctx.fillStyle=col; ctx.textAlign='left';
    ctx.fillText(text, px, by+1);
  };
  if(gap>0.04){
    chip('CONDUCTION BAND', cx+52, Y(EcBot)-16, '#ff8c42');
    chip('VALENCE BAND', cx+52, Y(EvTop)+44, '#00d4aa');
    chip('Eᵍ = '+gap.toFixed(2)+' eV', cx+52, (Y(EcBot)+Y(EvTop))/2+4, '#ffbe0b');
  } else {
    chip('MERGED BANDS', cx+52, Y(EvTop+bw.cb*0.9)-4, '#00ff88');
    chip('VALENCE BAND', cx+52, Y(EvTop)+48, '#00d4aa');
  }

  // ---- carriers ----
  const kT = PHYSICS.k_B_eV*Math.max(state.t1.temp,1);
  const thermal = state.t1.material==='metal' ? 1 : clamp(Math.exp(-gap/(2*kT))*40,0,1);
  const vbTop = Y(EvTop)+2, vbBot = Y(EvTop-bw.vb);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  t1.particles.forEach(p=>{
    const px = cx-34 + p.x*68, py = vbTop + 10 + p.y*Math.max(18,(vbBot-vbTop)*0.55);
    const g=ctx.createRadialGradient(px,py,0,px,py,6);
    g.addColorStop(0,'rgba(140,255,245,.95)'); g.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,6,0,6.29); ctx.fill();
    ctx.fillStyle='rgba(190,255,250,.95)'; ctx.beginPath(); ctx.arc(px,py,1.9,0,6.29); ctx.fill();
  });
  const nEx = Math.round(thermal*8);
  for(let i=0;i<nEx;i++){
    const px = cx-30+Math.random()*60;
    const py = gap<=0.04
      ? Y(EvTop)+4+Math.random()*Math.max(10,(Y(EvTop+bw.cb*0.85)-Y(EvTop)))

  // ---- legend ----

  const ly = h-6;

  ctx.fillStyle='rgba(232,232,255,.6)'; ctx.fillText('electrons (VB)', padL+12, ly);
  ctx.fillStyle='rgba(255,205,90,1)'; ctx.beginPath(); ctx.arc(padL+102,ly-4,3.2,0,6.29); ctx.fill();
  ctx.fillStyle='rgba(232,232,255,.6)'; ctx.fillText('excited e⁻ (CB)', padL+110, ly);

  if(w > 700) ctx.fillText('broadening ∝ orbital overlap', padL+232, ly);

  // ---- material comparison inset ----
  const insetW = narrow ? Math.min(220, w*0.46) : Math.min(340, w*0.32), insetH = narrow?84:96;

  ctx.fillStyle='rgba(8,8,26,.88)'; ctx.fillRect(inx,iny,insetW,insetH);
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1; ctx.strokeRect(inx,iny,insetW,insetH);
  ctx.fillStyle='rgba(232,232,255,.65)'; ctx.font='bold 9px Inter,sans-serif'; ctx.textAlign='left';
  ctx.fillText('MATERIAL COMPARISON', inx+10, iny+15);
  const miniMat = [

  const mw = (insetW-20-8)/3;
  miniMat.forEach((mm,i)=>{

    ctx.fillRect(x,y,mw,hh);
    ctx.strokeStyle = active ? mm.col : 'rgba(255,255,255,.16)';
    ctx.lineWidth = active ? 1.8 : 1;
    ctx.strokeRect(x,y,mw,hh);
    const gapPx = mm.gap===0 ? 0 : 4 + (mm.gap/5.47)*20;

    // valence band block
    ctx.fillStyle='rgba(0,212,170,.55)';
    ctx.fillRect(x+4, y+hh-vbH-3, mw-8, vbH);
    // conduction band block
    ctx.fillStyle='rgba(255,140,66,.55)';
    ctx.fillRect(x+4, y+3, mw-8, vbH);
    if(mm.gap===0){
      // metal: overlapping
      ctx.fillStyle='rgba(0,255,136,.45)';

      ctx.fillStyle='rgba(8,8,26,.9)';
      ctx.fillRect(x+4, y+3+vbH, mw-8, gapPx);
      ctx.strokeStyle=mm.col; ctx.lineWidth=1; ctx.setLineDash([2,2]);
      ctx.strokeRect(x+4, y+3+vbH, mw-8, gapPx); ctx.setLineDash([]);

    ctx.font = (active?'bold ':'')+(narrow?'7px':'8px')+' Inter,sans-serif'; ctx.textAlign='center';

  });
}

/* ============================================================
   TOPIC 2 — FERMI-DIRAC
   ============================================================ */
const t2 = { readouts:null };
function fermi(E, EF, T){
  if(T<=0) return E<=EF ? 1 : 0;
  const x = (E-EF)/(PHYSICS.k_B_eV*T);
  if(x>60) return 0; if(x<-60) return 1;
  return 1/(1+Math.exp(x));
}
function t2Update(){
  const { T, EF } = state.t2;
  const kT = PHYSICS.k_B_eV*T;
  t2.readouts.set('kT', kT.toFixed(4)+' eV');
  t2.readouts.set('fEF', '0.500');
  if(T<=0){
    t2.readouts.set('fp', '— (T = 0 K)');
    t2.readouts.set('fm', '— (T = 0 K)');
  } else {
    t2.readouts.set('fp', fermi(EF+kT, EF, T).toFixed(3));
    t2.readouts.set('fm', fermi(EF-kT, EF, T).toFixed(3));
  }
  const elT = document.getElementById('f2-T');
  if(elT) elT.textContent = T+' K';
}
function t2Render(){
  const c = canvases['t2']; if(!c) return;
  const { ctx, w, h } = c;
  ctx.clearRect(0,0,w,h);
  const padL=70, padR=30, padT=34, padB=48;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const { T, EF } = state.t2;
  const kT = PHYSICS.k_B_eV*T;
  // adaptive energy window: ±max(4kT, 0.05 eV) capped at ±0.5 eV
  const Erange = T<=0 ? 0.5 : clamp(6*kT, 0.06, 0.5);
  const X = f => padL + f*plotW;
  const Y = E => padT + (EF+Erange-E)/(2*Erange)*plotH;

  // grid
  ctx.strokeStyle='rgba(255,255,255,.065)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  for(let f=0;f<=1.001;f+=0.1){ ctx.beginPath(); ctx.moveTo(X(f),padT); ctx.lineTo(X(f),padT+plotH); ctx.stroke(); }
  for(let i=0;i<=8;i++){ const y=padT+i*plotH/8; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); }
  ctx.setLineDash([]);
  // axes
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+plotH); ctx.lineTo(w-padR,padT+plotH); ctx.stroke();

  // tick labels
  ctx.fillStyle='rgba(232,232,255,.55)'; ctx.font='10px JetBrains Mono,monospace'; ctx.textAlign='center';
  for(let f=0;f<=1.001;f+=0.2) ctx.fillText(f.toFixed(1), X(f), padT+plotH+18);
  ctx.textAlign='right';
  for(let i=0;i<=8;i++){
    const E = EF+Erange - i*(2*Erange/8);
    ctx.fillText((E>=0?'+':'')+E.toFixed(3), padL-8, padT+i*plotH/8+3);
  }
  ctx.fillStyle='rgba(232,232,255,.8)'; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('f(E) — occupation probability', padL+plotW/2, h-12);
  ctx.save(); ctx.translate(16, padT+plotH/2); ctx.rotate(-Math.PI/2);
  ctx.fillText('Energy E (eV)', 0, 0); ctx.restore();

  // occupied / empty shading
  if(state.t2.showFill){
    for(let py=padT; py<padT+plotH; py+=2){
      const E = EF+Erange - (py-padT)/plotH*2*Erange;
      const f = fermi(E, EF, T);
      if(E<=EF){
        ctx.fillStyle = 'rgba(0,240,255,.20)';
        ctx.fillRect(X(0), py, f*plotW, 2);
        ctx.fillStyle = 'rgba(255,0,110,.055)';
        ctx.fillRect(X(f), py, (1-f)*plotW, 2);
      } else {
        ctx.fillStyle = 'rgba(0,240,255,.16)';
        ctx.fillRect(X(0), py, f*plotW, 2);
        ctx.fillStyle = 'rgba(255,0,110,.10)';
        ctx.fillRect(X(f), py, (1-f)*plotW, 2);
      }
    }
  }

  // 1 - f(E)
  if(state.t2.show1mf){
    ctx.beginPath();
    for(let py=padT; py<=padT+plotH; py+=1.5){
      const E = EF+Erange - (py-padT)/plotH*2*Erange;
      const f = 1-fermi(E, EF, T);
      const px = X(f);
      if(py===padT) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.strokeStyle='rgba(255,0,110,.85)'; ctx.setLineDash([7,5]); ctx.lineWidth=2; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ff006e'; ctx.font='bold '+(w<620?'9px':'11px')+' Inter,sans-serif'; ctx.textAlign='left';
    ctx.fillText(w<620?'1 − f(E)':'1 − f(E)  (holes)', w<620 ? padL+8 : X(0.80), w<620 ? padT+plotH-28 : padT+20);
  }

  // thermal width band ±2kT
  if(state.t2.showWidth && T>0){
    ctx.fillStyle='rgba(255,190,11,.07)';
    ctx.fillRect(padL, Y(EF+2*kT), plotW, Y(EF-2*kT)-Y(EF+2*kT));
    ctx.strokeStyle='rgba(255,190,11,.55)'; ctx.setLineDash([3,4]); ctx.lineWidth=1;
    [2,-2].forEach(m=>{ const y=Y(EF+m*kT); ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-padR,y); ctx.stroke(); });
    ctx.setLineDash([]);
    ctx.fillStyle='#ffbe0b'; ctx.font='bold 10px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillText('±2kT = ±'+(2*kT).toFixed(4)+' eV', padL+10, Y(EF+2*kT)+14);
  }

  // f(E) curve
  ctx.beginPath();
  for(let py=padT; py<=padT+plotH; py+=1){
    const E = EF+Erange - (py-padT)/plotH*2*Erange;
    const f = fermi(E, EF, T);
    const px = X(f);
    if(py===padT) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  const grad = ctx.createLinearGradient(0,padT,0,padT+plotH);
  grad.addColorStop(0,'#ff4d94'); grad.addColorStop(.45,'#00f0ff'); grad.addColorStop(1,'#00f0ff');
  ctx.strokeStyle=grad; ctx.lineWidth=3.2; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=12; ctx.stroke(); ctx.shadowBlur=0;

  // Fermi level line + dot
  ctx.strokeStyle='rgba(0,255,136,.75)'; ctx.setLineDash([9,6]); ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.moveTo(padL,Y(EF)); ctx.lineTo(w-padR,Y(EF)); ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g2 = ctx.createRadialGradient(X(.5),Y(EF),0,X(.5),Y(EF),18);
  g2.addColorStop(0,'rgba(0,255,136,.95)'); g2.addColorStop(1,'rgba(0,255,136,0)');
  ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(X(.5),Y(EF),18,0,6.29); ctx.fill(); ctx.restore();
  ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(X(.5),Y(EF),5,0,6.29); ctx.fill();
  const _efChip=(txt,cx,cy)=>{
    ctx.font='bold 9px Inter,sans-serif';
    const tw=ctx.measureText(txt).width;
    ctx.fillStyle='rgba(4,10,10,.9)';
    ctx.fillRect(cx-tw-6, cy-10, tw+12, 15);
    ctx.strokeStyle='rgba(0,255,136,.45)'; ctx.lineWidth=1;
    ctx.strokeRect(cx-tw-6, cy-10, tw+12, 15);
  };
  ctx.fillStyle='rgba(0,255,136,.95)'; ctx.font='bold '+(w<620?'9px':'11px')+' Inter,sans-serif';
  ctx.textAlign = w<620 ? 'right' : 'left';
  if(w<620){
    _efChip('f(E_F) = 0.500', X(.5)-12, Y(EF)-14);
    ctx.fillStyle='rgba(0,255,136,.95)';
    ctx.fillText('f(E_F) = 0.500', X(.5)-12, Y(EF)-12);
  } else {
    ctx.fillText('E_F  →  f(E_F) = 0.500 always', X(.5)+14, Y(EF)-12);
  }

  // state annotation
  ctx.textAlign='left'; ctx.font='11px Inter,sans-serif';
  ctx.fillStyle='rgba(0,240,255,.75)'; ctx.fillText('f ≈ 1 · occupied', padL+8, padT+plotH-12);
  ctx.fillStyle='rgba(255,0,110,.8)'; ctx.fillText('f ≈ 0 · empty', padL+8, padT+16);
  if(T===0){
    ctx.fillStyle='rgba(255,190,11,.95)'; ctx.font='bold 12px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText('T = 0 K — perfect step at E_F', padL+plotW/2, padT+plotH-30);
  }
}

/* ============================================================
   TOPIC 3 — FERMI LEVEL
   ============================================================ */
const t3 = { readouts:null, pairs:[], time:0 };
function t3Physics(){
  const { doping, ND, NA, T, material } = state.t3;
  const m = MATERIALS[material];
  const kT = PHYSICS.k_B_eV*Math.max(T,1);
  // Effective N_C, N_V are scaled so that (a) N_C/N_V = m*_h/m*_e and
  // (b) sqrt(N_C N_V)·exp(-Eg/2kT) reproduces the tabulated n_i(T) exactly.
  // This guarantees n·p = n_i² while keeping textbook n_i values.
  const ni = niAt(T, material);
  const sN = ni*Math.exp(m.Eg/(2*Math.max(kT,1e-6)));
  const NC = sN*Math.sqrt(m.mh_me), NV = sN/Math.sqrt(m.mh_me);
  let EFrel; // Fermi level measured from E_V
  if(doping==='intrinsic' || T<=1){
    // E_F − E_i = ¾kT·ln(m*_h/m*_e) measured from mid-gap
    EFrel = m.Eg/2 + 0.75*kT*Math.log(m.mh_me);
  } else if(doping==='n'){
    EFrel = m.Eg - kT*Math.log(NC/ND);
    // clamp below Ec
    EFrel = Math.min(EFrel, m.Eg - 0.01);
  } else {
    EFrel = kT*Math.log(NV/NA);
    EFrel = Math.max(EFrel, 0.01);
  }
  const n = NC*Math.exp(-(m.Eg-EFrel)/kT);
  const p = NV*Math.exp(-EFrel/kT);
  return { EFrel, n, p, ni, NC, NV, kT, Eg:m.Eg };
}
function t3Update(dt){
  t3.time += dt;
  const ph = t3Physics();
  t3.readouts.set('ef', ph.EFrel.toFixed(3)+' eV');
  t3.readouts.set('n', fmtSci(ph.n));
  t3.readouts.set('p', fmtSci(ph.p));
  t3.readouts.set('np', fmtSci(ph.n*ph.p));
  t3.readouts.set('ni', fmtSci(ph.ni));
  const { doping } = state.t3;
  document.querySelectorAll('#formula-t3 .formula').forEach(f=>f.classList.toggle('active', f.dataset.doping===doping));
  const f3 = document.getElementById('f3-ni');
  if(f3) f3.innerHTML = `n<sub>i</sub>(T) = <span class="fv">${fmtSci(ph.ni)}</span> cm<sup>−3</sup>`;
  // e-h pairs
  const target = clamp(Math.round(Math.log10(Math.max(ph.ni,1))-8), 0, 40);
  if(t3.pairs.length < target && Math.random()<0.3) t3.pairs.push({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.02,vy:(Math.random()-.5)*.02});
  t3.pairs.forEach(p=>{ p.x+=p.vx*dt*10; p.y+=p.vy*dt*10; if(p.x<0||p.x>1)p.vx*=-1; if(p.y<0||p.y>1)p.vy*=-1; });
  if(t3.pairs.length>target) t3.pairs.splice(0, t3.pairs.length-target);
}
function t3Render(){
  const c = canvases['t3']; if(!c) return;
  const { ctx, w, h } = c;
  ctx.clearRect(0,0,w,h);
  const ph = t3Physics();
  const { doping, T, material } = state.t3;
  const Eg = ph.Eg;

  // ---------- header ----------
  ctx.textAlign='left'; ctx.font='bold 13px Inter,sans-serif'; ctx.fillStyle='rgba(232,232,255,.92)';
  ctx.fillText(material+' — energy band diagram', 22, 26);
  ctx.font='10px Inter,sans-serif'; ctx.fillStyle='rgba(232,232,255,.5)';
  ctx.fillText('T = '+T+' K · '+doping.toUpperCase()+' · Eᵍ = '+Eg.toFixed(2)+' eV', 22, 42);

  // ---------- geometry ----------
  const narrow3 = w < 620;
  const bodyTop = narrow3 ? 84 : 66, bodyBottom = h-(narrow3?150:172);
  const bandX = narrow3 ? 62 : 96, bandW = narrow3 ? 74 : Math.min(150, w*0.15);
  const bandTop = bodyTop+34, bandBot = bodyBottom-34;
  const Y = Erel => bandBot - (Erel/Eg)*(bandBot-bandTop);

  // ---------- band column ----------
  ctx.fillStyle='rgba(255,140,66,.09)'; ctx.fillRect(bandX, bandTop-32, bandW, 32);
  ctx.fillStyle='rgba(77,166,255,.09)'; ctx.fillRect(bandX, bandBot, bandW, 32);
  ctx.fillStyle='rgba(10,10,30,.75)'; ctx.fillRect(bandX, bandTop, bandW, bandBot-bandTop);
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.lineWidth=1; ctx.strokeRect(bandX, bandTop, bandW, bandBot-bandTop);

  // carrier clouds in bands
  const nDots = ph.n>1e-9 ? clamp(Math.round((Math.log10(ph.n)-4)*2.2),0,22) : 0;
  const pDots = ph.p>1e-9 ? clamp(Math.round((Math.log10(ph.p)-4)*2.2),0,22) : 0;
  for(let i=0;i<nDots;i++){
    const px = bandX+8+((i*41)%Math.max(10,bandW-16)), py = bandTop-24+((i*29)%20);
    ctx.fillStyle='rgba(0,240,255,.85)'; ctx.beginPath(); ctx.arc(px,py,2.2,0,6.29); ctx.fill();
  }
  for(let i=0;i<pDots;i++){
    const px = bandX+8+((i*37)%Math.max(10,bandW-16)), py = bandBot+6+((i*23)%18);
    ctx.strokeStyle='rgba(255,94,98,.9)'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(px,py,2.3,0,6.29); ctx.stroke();
  }

  ctx.fillStyle='rgba(255,140,66,.75)'; ctx.fillText('CONDUCTION BAND', bandX+bandW/2, bandTop-40);

  // donor / acceptor levels
  if(doping==='n'){
    ctx.strokeStyle='#ff5e62'; ctx.setLineDash([5,4]); ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(bandX,Y(Eg-0.05)); ctx.lineTo(bandX+bandW,Y(Eg-0.05)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#ff5e62'; ctx.font='bold 9px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillText('E_D', bandX+bandW+10, Y(Eg-0.05)+3);
  }
  if(doping==='p'){
    ctx.strokeStyle='#4da6ff'; ctx.setLineDash([5,4]); ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(bandX,Y(0.05)); ctx.lineTo(bandX+bandW,Y(0.05)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#4da6ff'; ctx.font='bold 9px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillText('E_A', bandX+bandW+8, Y(0.05)+3);
  }

  // gap label at left margin of band, snug
  const gapY = (Y(Eg)+Y(0))/2;
  if(!narrow3){
    ctx.textAlign='left'; ctx.fillStyle='rgba(255,190,11,.85)'; ctx.font='bold 9px JetBrains Mono,monospace';
    ctx.fillText('Eᵍ = '+Eg.toFixed(2)+' eV', 22, 58);
  }

  // ---------- Fermi level ----------
  const yf = Y(ph.EFrel);
  ctx.save();
  ctx.strokeStyle='rgba(0,255,136,.25)'; ctx.lineWidth=7;
  ctx.beginPath(); ctx.moveTo(bandX-22,yf); ctx.lineTo(bandX+bandW+22,yf); ctx.stroke();
  ctx.strokeStyle='#00ff88'; ctx.lineWidth=2.4; ctx.setLineDash([10,6]); ctx.lineDashOffset=-t3.time*24;
  ctx.beginPath(); ctx.moveTo(bandX-22,yf); ctx.lineTo(bandX+bandW+22,yf); ctx.stroke();
  ctx.restore();
  ctx.setLineDash([]); ctx.lineDashOffset=0;
  // E_F label — dark chip so it stays legible over band edges and dopant levels
  ctx.font='bold 9px JetBrains Mono,monospace';
  const efTxt='E_F', efW=ctx.measureText(efTxt).width+(narrow3?8:10);
  const efX=bandX+bandW/2, efY=yf-7;
  ctx.fillStyle='rgba(4,10,10,.92)';
  ctx.fillRect(efX-efW/2, efY-9, efW, 13);
  ctx.strokeStyle='rgba(0,255,136,.5)'; ctx.lineWidth=1;
  ctx.strokeRect(efX-efW/2, efY-9, efW, 13);
  ctx.fillStyle='#00ff88'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(efTxt, efX, efY-2);
  ctx.textBaseline='alphabetic';

  // ---------- mini f(E) plot ----------
  const mx = bandX+bandW+(narrow3?26:52), mw = narrow3 ? Math.max(52, w-bandX-bandW-26-20) : Math.min(120, w*0.12), my = bandTop, mh = bandBot-bandTop;

  ctx.textAlign='center'; ctx.fillStyle='rgba(232,232,255,.6)'; ctx.font='9px Inter,sans-serif';
  ctx.fillText('f(E)', mx+mw/2, my-10);
  ctx.fillStyle='rgba(232,232,255,.35)'; ctx.font='8px JetBrains Mono,monospace';
  ctx.fillText('0', mx+2, my+mh+11); ctx.fillText('1', mx+mw-2, my+mh+11);

  // shaded occupation
  ctx.beginPath(); ctx.moveTo(mx,my);

    ctx.lineTo(mx+f*mw, py);
  }
  ctx.lineTo(mx,my+mh); ctx.closePath();
  const gfill = ctx.createLinearGradient(mx,0,mx+mw,0);
  gfill.addColorStop(0,'rgba(0,240,255,.30)'); gfill.addColorStop(1,'rgba(0,240,255,.02)');
  ctx.fillStyle=gfill; ctx.fill();
  // curve
  ctx.beginPath();
  for(let py=my; py<=my+mh; py+=1.5){
    const Erel = Eg - (py-my)/mh*Eg;
    const f = fermi(Erel, ph.EFrel, Math.max(T,1));
    const px = mx+f*mw;
    if(py===my) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.strokeStyle='#00f0ff'; ctx.lineWidth=2; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=7; ctx.stroke(); ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,255,136,.65)'; ctx.setLineDash([4,3]); ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(mx,yf); ctx.lineTo(mx+mw,yf); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#00ff88'; ctx.beginPath(); ctx.arc(mx+mw/2,yf,2.6,0,6.29); ctx.fill();

  // ---------- readout card at right ----------
  const cardX = mx+mw+38, cardW = narrow3 ? 0 : Math.min(240, w-cardX-24);
  if(cardW > 130){
    const cardY = bandTop-10, cardH = Math.min(bandBot-bandTop+44, 190);
    ctx.fillStyle='rgba(10,10,30,.82)'; ctx.fillRect(cardX,cardY,cardW,cardH);
    ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.lineWidth=1; ctx.strokeRect(cardX,cardY,cardW,cardH);
    ctx.textAlign='left'; ctx.fillStyle='rgba(232,232,255,.55)'; ctx.font='bold 9px Inter,sans-serif';
    ctx.fillText('CARRIER STATISTICS', cardX+12, cardY+18);
    const rows = [
      ['E_F − E_V', ph.EFrel.toFixed(3)+' eV', '#00ff88'],
      ['n (electrons)', fmtSci(ph.n)+' cm⁻³', '#00f0ff'],
      ['p (holes)', fmtSci(ph.p)+' cm⁻³', '#ff5e62'],
      ['nᵢ (this T)', fmtSci(ph.ni)+' cm⁻³', '#e8e8ff'],
      ['n·p', fmtSci(ph.n*ph.p), '#ffbe0b'],
      ['nᵢ²', fmtSci(ph.ni*ph.ni), '#ffbe0b'],
    ];
    rows.forEach((r,i)=>{
      const ry = cardY+40+i*24;
      ctx.font='10px Inter,sans-serif'; ctx.fillStyle='rgba(232,232,255,.5)'; ctx.textAlign='left';
      ctx.fillText(r[0], cardX+12, ry);
      ctx.font='bold 11px JetBrains Mono,monospace'; ctx.fillStyle=r[2]; ctx.textAlign='right';
      ctx.fillText(r[1], cardX+cardW-12, ry);
    });
    const okCol = Math.abs(ph.n*ph.p - ph.ni*ph.ni) <= 0.01*Math.max(ph.ni*ph.ni,1e-12) ? '#00ff88' : '#ff8800';
    ctx.textAlign='center'; ctx.font='bold 9px Inter,sans-serif'; ctx.fillStyle=okCol;
    ctx.fillText('✓ n·p = nᵢ²  (mass-action law)', cardX+cardW/2, cardY+cardH-10);
  }

  // ---------- three-case comparison ----------
  const gapXc = narrow3 ? 12 : 22;
  const cw = narrow3 ? Math.max(64,(w-44-2*gapXc)/3) : Math.min(120,(w-140)/3.6);
  const ch = narrow3 ? 64 : 72;
  const cy = h-(narrow3?96:104), sx = 22;
  ctx.textAlign='left'; ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='bold 9px Inter,sans-serif';
  ctx.fillText('THREE-CASE COMPARISON', sx, cy-10);
  const panels = [
    { label:'Intrinsic', EF: clamp(Eg/2 + 0.75*ph.kT*Math.log(MATERIALS[material].mh_me),0.02,Eg-0.02), accent:'#ffbe0b' },
    { label:'N-type', EF: clamp(Eg - ph.kT*Math.log(ph.NC/state.t3.ND), 0.02, Eg-0.02), accent:'#ff5e62' },
    { label:'P-type', EF: clamp(ph.kT*Math.log(ph.NV/state.t3.NA), 0.02, Eg-0.02), accent:'#4da6ff' },
  ];
  panels.forEach((p,i)=>{
    const x = sx+i*(cw+gapXc);
    const isActive = (i===0&&doping==='intrinsic')||(i===1&&doping==='n')||(i===2&&doping==='p');
    ctx.fillStyle = isActive ? 'rgba(0,240,255,.09)' : 'rgba(10,10,30,.55)';
    ctx.fillRect(x,cy,cw,ch);
    ctx.strokeStyle = isActive ? 'rgba(0,240,255,.85)' : 'rgba(255,255,255,.12)';
    ctx.lineWidth = isActive ? 1.8 : 1;
    ctx.strokeRect(x,cy,cw,ch);
    const yy = Erel => cy+ch-7 - (Erel/Eg)*(ch-14);
    ctx.strokeStyle='#ff8c42'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+5,yy(Eg)); ctx.lineTo(x+cw-5,yy(Eg)); ctx.stroke();
    ctx.strokeStyle='#4da6ff';
    ctx.beginPath(); ctx.moveTo(x+5,yy(0)); ctx.lineTo(x+cw-5,yy(0)); ctx.stroke();
    ctx.strokeStyle='#00ff88'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(x+5,yy(p.EF)); ctx.lineTo(x+cw-5,yy(p.EF)); ctx.stroke();
    ctx.fillStyle=p.accent; ctx.font=(isActive?'bold ':'')+'10px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.label, x+cw/2, cy+ch+15);
  });

  if(T>600){
    ctx.fillStyle='#ffbe0b'; ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='right';
    ctx.fillText('⚠ intrinsic behavior — E_F → mid-gap', w-22, 42);
  }
}

/* ============================================================
   TOPIC 4 — HALL EFFECT
   ============================================================ */
const t4 = { readouts:null, particles:[], time:0, VH:0 };
function t4Physics(){
  const { I, B, carrier, d, n } = state.t4;
  const I_A = I/1000, d_m = d/1000;
  const sign = carrier==='n' ? -1 : 1;
  const RH = sign/(n*1e6*PHYSICS.e); // n cm^-3 -> m^-3
  const VH = RH * I_A * B / d_m;
  const EH = VH / 0.01; // width 1 cm
  return { RH, VH, EH };
}
function t4Update(dt){
  t4.time += dt;
  const ph = t4Physics();
  t4.VH = lerp(t4.VH, ph.VH, 1-Math.exp(-dt*2));
  t4.readouts.set('vh', (t4.VH*1000).toFixed(2)+' mV');
  t4.readouts.set('rh', fmtSci(ph.RH)+' m³/C');
  t4.readouts.set('eh', (ph.EH).toFixed(1)+' V/m');
  t4.readouts.set('pol', state.t4.carrier==='n' ? 'N-type · V_H < 0' : 'P-type · V_H > 0');
  // particles
  const speed = state.t4.speed;
  const nTarget = 55;
  while(t4.particles.length < nTarget)
    t4.particles.push({ x: 0.02+Math.random()*0.96, y:0.18+Math.random()*0.64, life:Math.random()*3, hist:[] });
  const B = state.t4.B, I = state.t4.I;
  const driftSpeed = (0.04 + I/100*0.42) * speed;
  // Lorentz deflection: drives carriers toward one face, saturating as V_H grows
  const deflectDir = state.t4.carrier==='n' ? 1 : 1;
  t4.particles.forEach(p=>{
    p.life += dt;
    if(!p.hist) p.hist = [];
    p.x += driftSpeed*dt*(state.t4.carrier==='n' ? -1 : 1);
    // each carrier relaxes toward a slightly different point on the accumulation face
    if(p.jit === undefined) p.jit = (Math.random()-0.5)*0.20;
    const target = clamp(0.50 + 0.40*Math.min(B/2,1) + p.jit, 0.08, 0.94);
    p.y += (target - p.y)*dt*(1.1 + 2.4*B);
    p.y += Math.sin(t4.time*4+p.life*6)*0.0016;
    p.hist.push({x:p.x, y:p.y});
    if(p.hist.length > 34) p.hist.shift();
    // recycle at the far end so the stream keeps flowing
    const exited = state.t4.carrier==='n' ? (p.x <= 0.021) : (p.x >= 0.979);
    if(exited){
      p.x = state.t4.carrier==='n' ? 0.985 : 0.015;
      p.y = 0.18+Math.random()*0.64; p.life = 0; p.hist = [];
    }
  });
}
function t4Render(){
