    ctx.fillStyle='rgba(232,232,255,.4)'; ctx.font='8px JetBrains Mono,monospace'; ctx.textAlign='center';
    ctx.fillText('0', gx0, gy1+11); ctx.fillText('2 T', gx1, gy1+11);
    ctx.textAlign='right'; ctx.fillText('V_H', gx0-4, gy0+8);
    ctx.textAlign='left'; ctx.fillStyle='rgba(255,190,11,.85)'; ctx.font='bold 9px JetBrains Mono,monospace';
    ctx.fillText((Math.abs(t4.VH)*1000).toFixed(2)+' mV', px0+10, py0+phh-6);
  }
  ctx.fillStyle = carrier==='n' ? '#00f0ff' : '#ff5e62';
  ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='left';
  ctx.fillText(narrow4
    ? (carrier==='n' ? 'e⁻ drift −x · F = −e(v×B)' : 'h⁺ drift +x · F = +e(v×B)')
    : (carrier==='n' ? 'e⁻ drift −x, deflected by F = −e(v×B)' : 'h⁺ drift +x, deflected by F = +e(v×B)'),
    ox, iy+(narrow4?34:44));

  // ---------- voltmeter ----------
  const vx = ox+boxW+dxs+(narrow4?34:52), vy = oy+boxH/2 + (narrow4?26:0);
  ctx.strokeStyle='rgba(232,232,255,.45)'; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(ox+boxW+6, oy+12); ctx.lineTo(vx-24, vy-34); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ox+boxW+6, oy+boxH-6); ctx.lineTo(vx-24, vy+34); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(12,12,34,.9)'; ctx.strokeStyle='rgba(255,190,11,.9)'; ctx.lineWidth=2;
  const vr = narrow4?24:32;
  ctx.beginPath(); ctx.arc(vx,vy,vr,0,6.29); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#ffbe0b'; ctx.font='bold '+(narrow4?'9px':'11px')+' JetBrains Mono,monospace'; ctx.textAlign='center';
  ctx.fillText('V_H', vx, vy-(narrow4?5:8));
  ctx.fillStyle= t4.VH<0 ? '#4da6ff' : '#ff5e62';
  ctx.fillText((t4.VH*1000).toFixed(1)+'mV', vx, vy+(narrow4?7:8));
  if(!narrow4){
    ctx.fillStyle='rgba(232,232,255,.6)'; ctx.font='9px Inter,sans-serif';
    ctx.fillText('voltmeter', vx, vy+46);
  }

  // ---------- force inset ----------
  const iw=narrow4?132:176, ih=narrow4?84:104, ix = w-iw-12, iy2 = h-ih-10;
  ctx.fillStyle='rgba(8,8,26,.92)'; ctx.fillRect(ix,iy2,iw,ih);
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.strokeRect(ix,iy2,iw,ih);
  ctx.fillStyle='rgba(232,232,255,.9)'; ctx.font='bold '+(narrow4?'8px':'10px')+' Inter,sans-serif'; ctx.textAlign='left';
  ctx.fillText('FORCE BALANCE', ix+10, iy2+(narrow4?14:18));
  ctx.font=(narrow4?'8px':'10px')+' JetBrains Mono,monospace';
  const stepY = narrow4?15:19;
  ctx.fillStyle='#ff006e'; ctx.fillText('F_B = q(v×B)', ix+10, iy2+(narrow4?30:38));
  ctx.fillStyle='#ffbe0b'; ctx.fillText('F_E = q·E_H', ix+10, iy2+(narrow4?30:38)+stepY);
  ctx.fillStyle='#00ff88'; ctx.fillText('F_B = F_E ✓', ix+10, iy2+(narrow4?30:38)+2*stepY);
  if(!narrow4){
    ctx.fillStyle='rgba(232,232,255,.5)'; ctx.font='9px Inter,sans-serif';
    ctx.fillText('net transverse force → 0', ix+10, iy2+93);
  }
}

/* ============================================================
   TOPIC 5 — P-N JUNCTION
   ============================================================ */
const t5 = { readouts:null, carriers:[], time:0 };
function t5Physics(){
  const { V, T, NA, ND } = state.t5;
  const kT = PHYSICS.k_B_eV*Math.max(T,1);
  const ni = niAt(T,'Si');
  const V0 = (kT)*Math.log(NA*ND/(ni*ni)); // in volts (kT in eV)
  const eps = PHYSICS.epsilon_0*PHYSICS.epsilon_Si;
  const W_m = Math.sqrt(2*eps*Math.max(V0-V,0.01)*(1/(NA*1e6)+1/(ND*1e6))/PHYSICS.e);
  const I0 = 1e-14*Math.pow(T/300,3);
  const eta = 1;
  const I = I0*(Math.exp(clamp(V/(eta*kT),-40,40))-1);
  return { V0, W_um:W_m*1e6, I, I0, kT, ni };
}
function t5Update(dt){
  t5.time += dt;
  const ph = t5Physics();
  const { V } = state.t5;
  t5.readouts.set('v0', ph.V0.toFixed(3)+' V');
  t5.readouts.set('w', ph.W_um.toFixed(3)+' μm');
  t5.readouts.set('i', fmtSci(ph.I*1000)+' mA');
  t5.readouts.set('barrier', 'e(V₀'+(V>=0?'−':'+')+Math.abs(V).toFixed(2)+') = '+Math.max(ph.V0-V,0).toFixed(3)+' eV');
  const st = Math.abs(V)<0.02 ? 'ZERO BIAS' : V>0 ? 'FORWARD BIAS' : 'REVERSE BIAS';
  const el = document.getElementById('t5-state');
  if(el){ el.textContent = st; el.style.color = st==='ZERO BIAS'?'#ffbe0b':V>0?'#00ff88':'#ff006e'; }
  // carriers
  if(state.t5.showCarriers && t5.carriers.length<64 && Math.random()<0.5){
    const side = Math.random()<0.5?'n':'p';
    t5.carriers.push({
      x: side==='n'? 0.56+Math.random()*0.40 : 0.04+Math.random()*0.40,
      y: 0.12+Math.random()*0.72, side, vy:(Math.random()-.5)*0.03 });
  }
  t5.carriers.forEach(c=>{
    const dir = c.side==='n' ? -1 : 1;
    if(V>0.05) c.vx = dir*0.16;                       // forward: both types cross the junction
    else if(V<-0.05) c.vx = -dir*0.10;                // reverse: pulled away from the junction
    else c.vx = (Math.random()-0.5)*0.02;
    c.x += c.vx*dt; c.y += c.vy*dt;
    if(c.y<0.05||c.y>0.95) c.vy *= -1;
    if(c.x<0.02||c.x>0.98){
      c.side = c.x<0.5 ? 'p' : 'n';
      c.x = c.side==='n'?0.56+Math.random()*0.40:0.04+Math.random()*0.40;
      c.y = 0.12+Math.random()*0.72;
    }
  });
}
function t5Render(){
  const c = canvases['t5']; if(!c) return;
  const { ctx, w, h } = c;
  ctx.clearRect(0,0,w,h);
  const ph = t5Physics();
  const { V } = state.t5;
  const showIV = state.t5.showIV;
  const narrow = w < 620;
  const bandH = showIV ? h*(narrow?0.60:0.58) : h-30;
  const padL=64, padR=26, padT=40;
  const plotW = w-padL-padR;
  const X = x => padL + x*plotW;

  /* ---------------- ENERGY BAND DIAGRAM ----------------
     Physics: in equilibrium E_F is flat. On the p-side E_F sits just above E_V,
     so E_C(p) is high; on the n-side E_F sits just below E_C, so the whole
     band structure is LOWER. Hence E_C and E_V slope DOWN from p to n,
     and electrons (n-side) see a barrier of height e(V0 - V).            */
  const Eg = 1.12;
  const EcP = 1.62;                     // E_C on the p-side (flat band)
  const bendReal = Math.max(ph.V0 - V, 0.02);
  const sig = x => 1/(1+Math.exp(-(x-0.5)/0.055));
  const Ecx = x => EcP - bendReal*sig(x);
  const Evx = x => Ecx(x) - Eg;
  const Emax = EcP + 0.62;
  const Emin = Evx(1) - 0.68;
  const span = Emax - Emin;
  const Y = E => padT + (Emax-E)/span*(bandH-padT-30);

  // P / N background tints
  ctx.fillStyle='rgba(77,166,255,.05)'; ctx.fillRect(padL, padT-6, plotW*0.5, bandH-padT-18);
  ctx.fillStyle='rgba(255,140,66,.05)'; ctx.fillRect(padL+plotW*0.5, padT-6, plotW*0.5, bandH-padT-18);

  // depletion region
  const Wfrac = clamp(ph.W_um/1.6, 0.10, 0.52);
  const depL = 0.5-Wfrac/2, depR = 0.5+Wfrac/2;
  const gradDep = ctx.createLinearGradient(X(depL),0,X(depR),0);
  gradDep.addColorStop(0,'rgba(255,190,11,.15)'); gradDep.addColorStop(.5,'rgba(255,190,11,.05)'); gradDep.addColorStop(1,'rgba(255,190,11,.15)');
  ctx.fillStyle=gradDep; ctx.fillRect(X(depL), padT-6, X(depR)-X(depL), bandH-padT-18);
  ctx.strokeStyle='rgba(255,190,11,.55)'; ctx.setLineDash([5,4]); ctx.lineWidth=1.4;
  [depL,depR].forEach(d=>{ ctx.beginPath(); ctx.moveTo(X(d),padT-6); ctx.lineTo(X(d),bandH-24); ctx.stroke(); });
  ctx.setLineDash([]);
  ctx.fillStyle='#ffbe0b'; ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('W = '+ph.W_um.toFixed(2)+' μm', X(0.5), padT+11);

  // carriers, drawn inside their own bands
  if(state.t5.showCarriers){
    ctx.save(); ctx.globalCompositeOperation='lighter';
    t5.carriers.forEach(cc=>{
      const px=X(cc.x);
      const yTop = Y(Ecx(cc.x)), yBot = Y(Evx(cc.x));
      // electrons sit just below E_C, holes just above E_V
      const py = cc.side==='n'
        ? yTop + 6 + cc.y*Math.max(6,(yBot-yTop)*0.30)
        : yBot - 6 - cc.y*Math.max(6,(yBot-yTop)*0.30);
      if(cc.side==='n'){
        ctx.fillStyle='rgba(0,240,255,.95)'; ctx.beginPath(); ctx.arc(px,py,3.3,0,6.29); ctx.fill();
      } else {
        ctx.strokeStyle='rgba(255,94,98,1)'; ctx.lineWidth=1.7; ctx.beginPath(); ctx.arc(px,py,3.7,0,6.29); ctx.stroke();
      }
    });
    ctx.restore();
  }

  // the two bands
  const drawBand=(fn,color,label,above)=>{
    ctx.beginPath();
    for(let i=0;i<=140;i++){ const x=i/140; if(i===0) ctx.moveTo(X(x),Y(fn(x))); else ctx.lineTo(X(x),Y(fn(x))); }
    ctx.strokeStyle=color; ctx.lineWidth=2.8; ctx.shadowColor=color; ctx.shadowBlur=8; ctx.stroke(); ctx.shadowBlur=0;
    ctx.textAlign='left'; ctx.fillStyle=color;
    ctx.font='bold '+(narrow?'10px':'11px')+' JetBrains Mono,monospace';
    ctx.fillText(label, padL+6, Y(fn(0)) + (above?-11:19));
  };
  drawBand(Ecx,'#ff8c42','E_C(x)',true);
  drawBand(Evx,'#4da6ff','E_V(x)',false);

  // built-in potential dimension (p-side flat vs n-side flat)
  if(!narrow){
    const bx = X(0.965);
    ctx.strokeStyle='rgba(255,190,11,.85)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(bx,Y(Ecx(0.06))); ctx.lineTo(bx,Y(Ecx(0.94))); ctx.stroke();
    [-1,1].forEach(d=>{
      ctx.beginPath(); ctx.moveTo(bx-5,Y(Ecx(0.06))); ctx.lineTo(bx+5,Y(Ecx(0.06))); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx-5,Y(Ecx(0.94))); ctx.lineTo(bx+5,Y(Ecx(0.94))); ctx.stroke();
    });
    ctx.fillStyle='#ffbe0b'; ctx.font='bold 10px JetBrains Mono,monospace'; ctx.textAlign='right';
    ctx.fillText('e(V₀−V) = '+(ph.V0-V).toFixed(2)+' eV', bx-8, (Y(Ecx(0.06))+Y(Ecx(0.94)))/2);
  }

  // quasi-Fermi levels: E_Fp on the p-side, E_Fn = E_Fp + eV on the n-side
  const EFp = Evx(0) + 0.26;
  const EFn = EFp + V;
  ctx.strokeStyle='rgba(0,255,136,.85)'; ctx.setLineDash([9,6]); ctx.lineWidth=1.9;
  ctx.beginPath(); ctx.moveTo(padL, Y(EFp)); ctx.lineTo(X(0.48), Y(EFp)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(0.52), Y(clamp(EFn, Emin, Emax))); ctx.lineTo(w-padR, Y(clamp(EFn, Emin, Emax))); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#00ff88'; ctx.font='bold '+(narrow?'9px':'11px')+' Inter,sans-serif';
  ctx.textAlign='left';
  const efLabel = Math.abs(V)<0.02 ? (narrow ? 'E_F' : 'E_F (flat — equilibrium)') : 'E_Fp';
  ctx.fillText(efLabel, padL+6, Y(EFp)-8);
  ctx.textAlign='left';
  ctx.fillText(Math.abs(V)<0.02 ? '' : 'E_Fn', X(0.53)+2, Y(clamp(EFn,Emin,Emax))-8);

  // eV separation arrow (desktop only)
  if(Math.abs(V)>=0.02 && !narrow){
    const ax = w-padR-14;
    const y1=Y(EFp), y2=Y(clamp(EFn,Emin,Emax));
    ctx.strokeStyle='rgba(0,255,136,.7)'; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(ax,y1); ctx.lineTo(ax,y2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax-4,y1); ctx.lineTo(ax+4,y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ax-4,y2); ctx.lineTo(ax+4,y2); ctx.stroke();
    ctx.fillStyle='#00ff88'; ctx.font='bold 10px JetBrains Mono,monospace'; ctx.textAlign='right';
    ctx.fillText('eV = '+Math.abs(V).toFixed(2)+' eV', ax-8, (y1+y2)/2+3);
  }

  // space charge: acceptors on the p-half of the depletion region, donors on the n-half
  if(state.t5.showCharge){
    ctx.font='bold 14px Inter,sans-serif'; ctx.textAlign='center';
    for(let i=0;i<4;i++){
      const x = depL + (i+0.5)/4*(0.5-depL);
      ctx.fillStyle='rgba(77,166,255,.95)';
      ctx.fillText('⊖', X(x), (Y(Evx(x))+Y(Ecx(x)))/2 + 26);
    }
    for(let i=0;i<4;i++){
      const x = 0.5 + (i+0.5)/4*(depR-0.5);
      ctx.fillStyle='rgba(255,94,98,.95)';
      ctx.fillText('⊕', X(x), (Y(Evx(x))+Y(Ecx(x)))/2 - 20);
    }
    if(!narrow){
      ctx.fillStyle='rgba(232,232,255,.5)'; ctx.font='9px Inter,sans-serif'; ctx.textAlign='center';
      ctx.fillText('fixed acceptors (−)', X(0.5)-60, bandH-30);
      ctx.fillText('fixed donors (+)', X(0.5)+60, bandH-30);
    }
  }

  // electric-field profile (peak at the metallurgical junction)
  if(state.t5.showEfield){
    ctx.beginPath();
    for(let i=0;i<=140;i++){
      const x=i/140;
      const g = bendReal*Math.exp(-Math.pow((x-0.5)/0.09,2));
      const y = bandH-46 - g*34;
      if(i===0) ctx.moveTo(X(x),y); else ctx.lineTo(X(x),y);
    }
    ctx.strokeStyle='rgba(255,0,110,.9)'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#ff006e'; ctx.font='bold 9px Inter,sans-serif'; ctx.textAlign='left';
    ctx.fillText('|E(x)| — peaks at the junction', padL+6, bandH-56);
  }

  // carrier legend + side labels
  if(state.t5.showCarriers && !narrow){
    ctx.textAlign='left'; ctx.font='9px Inter,sans-serif';
    ctx.fillStyle='rgba(0,240,255,.95)'; ctx.beginPath(); ctx.arc(padL+6, padT+11, 3.2, 0, 6.29); ctx.fill();
    ctx.fillStyle='rgba(232,232,255,.6)'; ctx.fillText('e⁻', padL+14, padT+14);
    ctx.strokeStyle='rgba(255,94,98,1)'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(padL+38, padT+11, 3.4, 0, 6.29); ctx.stroke();
    ctx.fillStyle='rgba(232,232,255,.6)'; ctx.fillText('h⁺', padL+46, padT+14);
  }
  ctx.fillStyle='rgba(232,232,255,.62)'; ctx.font='11px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('P-side', X(0.22), bandH-8);
  ctx.fillText('N-side', X(0.80), bandH-8);

  if(!showIV) return;

  /* ---------------- I–V CHARACTERISTIC ---------------- */
  const iy0 = bandH+24, iy1 = h-42, ix0 = padL, ix1 = w-padR;
  const tight = (ix1-ix0) < 470 || (iy1-iy0) < 200;
  ctx.fillStyle='rgba(8,8,26,.55)'; ctx.fillRect(ix0,iy0,ix1-ix0,iy1-iy0);
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1; ctx.strokeRect(ix0,iy0,ix1-ix0,iy1-iy0);

  // nonlinear (asinh) voltage axis concentrates resolution around the diode knee
  const VX = v => {
    const s = Math.asinh(v/0.15)/Math.asinh(5.2/0.15);
    return ix0 + (s*0.5+0.5)*(ix1-ix0);
  };
  const VX0 = VX(0);
  const I0vis = Math.max(ph.I0,1e-18);
  const IY = I => {
    const mid=(iy0+iy1)/2;
    const sgn = Math.sign(I)*Math.log10(1+Math.abs(I)/I0vis)/16;
    return mid - sgn*(iy1-iy0)/2;
  };
  ctx.strokeStyle='rgba(255,255,255,.22)';
  ctx.beginPath(); ctx.moveTo(VX0,iy0+4); ctx.lineTo(VX0,iy1-4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ix0,(iy0+iy1)/2); ctx.lineTo(ix1,(iy0+iy1)/2); ctx.stroke();

  ctx.beginPath();
  for(let i=0;i<=300;i++){
    const v = -5 + 5.9*i/300;
    const I = ph.I0*(Math.exp(clamp(v/Math.max(ph.kT,0.005),-40,40))-1);
    const px=VX(v), py=IY(I);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.strokeStyle='#00f0ff'; ctx.lineWidth=2.6; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=10; ctx.stroke(); ctx.shadowBlur=0;

  ctx.fillStyle='rgba(232,232,255,.5)'; ctx.font='9px JetBrains Mono,monospace'; ctx.textAlign='center';
  [-5,-2,-1,-0.5,0,0.4,0.8].forEach(v=>ctx.fillText(v.toFixed(1), VX(v), iy1+14));
  ctx.textAlign='left'; ctx.fillStyle='rgba(232,232,255,.7)'; ctx.font='10px Inter,sans-serif';
  ctx.fillText('V (volts) →', ix1-56, iy1+28);
  ctx.fillText('I ↑', ix0+4, iy0+12);
  if(!tight){
    ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='10px JetBrains Mono,monospace';
    ctx.fillText('I₀ = '+fmtSci(ph.I0)+' A', ix0+8, iy0+26);
  }

  // operating point
  const opx=VX(V), opy=IY(ph.I);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(opx,opy,0,opx,opy,16);
  g.addColorStop(0,'rgba(255,190,11,.95)'); g.addColorStop(1,'rgba(255,190,11,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(opx,opy,16,0,6.29); ctx.fill(); ctx.restore();
  ctx.fillStyle='#ffbe0b'; ctx.beginPath(); ctx.arc(opx,opy,5.5,0,6.29); ctx.fill();

  if(!tight){
    const lbl = (V>=0? '+':'')+V.toFixed(2)+' V · I = '+fmtSci(ph.I)+' A';
    ctx.textAlign='left'; ctx.font='bold 10px JetBrains Mono,monospace'; ctx.fillStyle='#ffbe0b';
    ctx.fillText(lbl, clamp(opx+14, ix0+8, ix1-150), clamp(opy-12, iy0+40, iy1-8));
  }

  const stateTxt = Math.abs(V)<0.02?'ZERO BIAS':V>0?'FORWARD BIAS':'REVERSE BIAS';
  const stateCol = Math.abs(V)<0.02?'#ffbe0b':V>0?'#00ff88':'#ff006e';
  ctx.fillStyle=stateCol; ctx.font='bold 11px Inter,sans-serif'; ctx.textAlign='right';
  ctx.fillText(stateTxt, ix1-8, iy0+17);
}

/* ============================================================
   TOPIC 6 — SOLAR CELL
   ============================================================ */
const t6 = { readouts:null, photons:[], pairs:[], time:0 };
function t6Physics(){
  const { G, lambda, RL, T, material } = state.t6;
  const m = MATERIALS[material];
  const kT = PHYSICS.k_B_eV*Math.max(T,1);
  const hnu = 1240/lambda;
  const absorbed = hnu >= m.Eg;
  const IL = 35e-3 * (G/1000) * (absorbed?1:0); // A (1 cm² cell)
  const I0 = 1e-12 * Math.pow(T/300,3) * Math.exp(-(m.Eg-1.12)/(2*kT));
  const Voc = IL>0 ? kT*Math.log(IL/I0+1) : 0;
  // find MPP by scan
  let Vmp=0, Imp=0, Pmax=0;
  for(let i=0;i<=200;i++){
    const V = Voc*i/200;
    const I = IL - I0*(Math.exp(clamp(V/kT,-40,40))-1);
    if(I>0 && V*I>Pmax){ Pmax=V*I; Vmp=V; Imp=I; }
  }
  const FF = (IL>0&&Voc>0) ? Pmax/(IL*Voc) : 0;
  const Pinc = G*1e-4*1; // W on 1 cm² (G W/m² * 1e-4 m²)
  const eta = Pinc>0 ? Pmax/Pinc : 0;
  // operating point: I = V/RL intersect
  let Vop=0, Iop=0;
  if(RL<=0.01){ Vop=0; Iop=IL; }
  else if(RL>1e6){ Vop=Voc; Iop=0; }
  else {
    let best=1e9;
    for(let i=0;i<=400;i++){
      const V = Voc*i/400;
      const I = IL - I0*(Math.exp(clamp(V/kT,-40,40))-1);
      const diff = Math.abs(I - V/RL);
      if(diff<best){ best=diff; Vop=V; Iop=Math.max(I,0); }
    }
  }
  return { hnu, absorbed, IL, Voc, Vmp, Imp, Pmax, FF, eta, Vop, Iop, kT, I0 };
}
function t6Update(dt){
  t6.time += dt;
  const ph = t6Physics();
  t6.readouts.set('isc', (ph.IL*1000).toFixed(2)+' mA');
  t6.readouts.set('voc', ph.Voc.toFixed(3)+' V');
  t6.readouts.set('pmax', (ph.Pmax*1000).toFixed(2)+' mW');
  t6.readouts.set('ff', (ph.FF*100).toFixed(1)+' %');
  t6.readouts.set('eta', (ph.eta*100).toFixed(2)+' %');
  t6.readouts.set('hnu', ph.hnu.toFixed(2)+' eV '+(ph.absorbed?'≥ Eᵍ ✓':'< Eᵍ ✗'));
  const f6 = document.getElementById('f6-eta');
  if(f6) f6.innerHTML = `η = P<sub>max</sub>/(A·G) = <span class="fv">${(ph.eta*100).toFixed(2)}%</span>`;

  // photon flux ∝ intensity; each photon has a random entry column
  const rate = (state.t6.G/1000);
  if(t6.photons.length < 34 && Math.random() < rate*dt*14)
    t6.photons.push({ x:0.04+Math.random()*0.92, y:0, ph:Math.random()*6.28, absorbed:false, hit:false });

  // depth scale: 0 = above device, 1 = device top, 2 = back contact
  t6.photons.forEach(p=>{
    p.y += dt*(0.55 + rate*0.35);
    if(!p.hit && p.y>=1){
      p.hit = true;
      // absorption probability: Si absorbs strongly for hν ≥ Eg
      const depthFactor = 0.55 + 0.4*Math.min((ph.hnu - MATERIALS[state.t6.material].Eg)/1.2, 1);
      p.absorbed = ph.absorbed && Math.random() < depthFactor;
      if(p.absorbed){
        t6.pairs.push({ x:p.x, y:1.02, t:0 });
        p.y = 3;  // consumed
      }
    }
  });
  t6.photons = t6.photons.filter(p=>p.y<2.6);

  // electron–hole pairs: drift apart under the built-in field
  t6.pairs.forEach(p=>{
    p.t += dt;
    p.y += dt*0.55;         // diffuses deeper into base
  });
  t6.pairs = t6.pairs.filter(p=>p.t < 2.2);
}

function t6Render(){
  const c = canvases['t6']; if(!c) return;
  const { ctx, w, h } = c;
  ctx.clearRect(0,0,w,h);
  const ph = t6Physics();
  const stack = w < 760;
  const devW = stack ? w-20 : w*0.42;
  const devX = stack ? 10 : 14;
  // in stacked mode the device gets the top half and the I–V plot the bottom half
  const devScale = stack ? 0.52 : 1;

  // ================= DEVICE CROSS-SECTION =================
  const top = stack ? 78 : 104;
  const dx=devX+16, dw=Math.max(120,devW-52);
  const nH=Math.round(46*devScale), depH=Math.round(32*devScale), pH=Math.round(142*devScale);
  const contactH=13;
  const layers = [
    { name:'Top grid contact', h:contactH, col:'rgba(232,232,255,.22)', grid:true },
    { name:'N-type emitter (~0.5 μm)', h:nH, col:'rgba(255,140,66,.20)' },
    { name:'Depletion region', h:depH, col:'rgba(255,190,11,.16)' },
    { name:'P-type base (~300 μm)', h:pH, col:'rgba(77,166,255,.18)' },
    { name:'Back contact', h:contactH, col:'rgba(232,232,255,.22)' },
  ];
  let ly = top;
  layers.forEach(L=>{
    ctx.fillStyle=L.col; ctx.fillRect(dx,ly,dw,L.h);
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=1; ctx.strokeRect(dx,ly,dw,L.h);
    if(L.grid){
      ctx.strokeStyle='rgba(232,232,255,.45)';
      for(let i=0;i<7;i++){ const gx=dx+8+i*(dw-16)/6; ctx.beginPath(); ctx.moveTo(gx,ly); ctx.lineTo(gx,ly+L.h); ctx.stroke(); }
    }
    ly += L.h;
  });
  const depY = top+contactH+nH;

  // labels (small, inside left)
  ctx.textAlign='left'; ctx.font='9px Inter,sans-serif';
  const labels = [
    ['n-type', top+contactH+nH/2+3],
    ['depletion', depY+depH/2+3],
    ['p-type', depY+depH+pH/2+3],
  ];
  labels.forEach(([t,y])=>{ ctx.fillStyle='rgba(232,232,255,.55)'; ctx.fillText(t, dx+6, y); });

  // built-in field
  ctx.strokeStyle='rgba(255,190,11,.85)'; ctx.lineWidth=2.5;
  const fx = dx+dw*0.5;
  ctx.beginPath(); ctx.moveTo(fx, depY+2); ctx.lineTo(fx, depY+depH-2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx,depY+depH-2); ctx.lineTo(fx-5,depY+depH-9); ctx.lineTo(fx+5,depY+depH-9);
  ctx.closePath(); ctx.fillStyle='rgba(255,190,11,.85)'; ctx.fill();

  // photons (wavy, falling into device)
  const pcol = wavelengthToColor(state.t6.lambda);
  t6.photons.forEach(p=>{
    const px = dx + 12 + p.x*(dw-24);
    const py = top-(stack?44:64) + Math.min(p.y,1)*(stack?44:64);
    ctx.strokeStyle=pcol; ctx.lineWidth=1.8; ctx.globalAlpha=.9;
    ctx.beginPath();
    for(let i=0;i<=12;i++){ const xx=px-12+i*2, yy=py+Math.sin(i*1.1+t6.time*7+p.ph)*3; if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); }
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px,py+6); ctx.lineTo(px,py+13); ctx.stroke();
    ctx.globalAlpha=1;
  });
  // e-h pairs being swept
  ctx.save(); ctx.globalCompositeOperation='lighter';
  t6.pairs.forEach(p=>{
    const px = dx+12+p.x*(dw-24);
    const head = depY + Math.min(p.t*40, pH*0.85);
    const ey = head - Math.min(p.t,1)*30;   // electron swept toward n-side
    const hy = head + Math.min(p.t,1)*22;   // hole drifts into p-base
    ctx.fillStyle='rgba(0,240,255,.95)'; ctx.beginPath(); ctx.arc(px,ey,4,0,6.29); ctx.fill();
    ctx.strokeStyle='rgba(255,94,98,.95)'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(px+9,hy,4,0,6.29); ctx.stroke();
    // sweeping arrows
    ctx.strokeStyle='rgba(0,240,255,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px,ey); ctx.lineTo(px,ey-10); ctx.stroke();
  });
  ctx.restore();

  // wavelength label + absorption indicator
  ctx.textAlign='left';
  ctx.fillStyle=pcol; ctx.font='bold 11px Inter,sans-serif';
  ctx.fillText('λ = '+state.t6.lambda+' nm', dx, 18);
  ctx.fillStyle='rgba(232,232,255,.8)'; ctx.font='10px JetBrains Mono,monospace';
  ctx.fillText('hν = '+ph.hnu.toFixed(2)+' eV', dx+96, 18);
  if(!stack){
    ctx.fillStyle = ph.absorbed ? '#00ff88' : '#ff5e62';
    ctx.font='bold 10px Inter,sans-serif';
    ctx.fillText(ph.absorbed ? 'hν ≥ Eᵍ  →  absorbed ✓' : 'hν < Eᵍ  →  transmitted ✗', dx, 35);
    ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='9px Inter,sans-serif';
    ctx.fillText('photon flux ∝ intensity', dx, 50);
  }

  // external circuit
  const cy = top+contactH;
  ctx.strokeStyle='rgba(232,232,255,.55)'; ctx.lineWidth=2;
  const wireH = stack?22:32;
  ctx.beginPath(); ctx.moveTo(dx+dw*0.35, cy); ctx.lineTo(dx+dw*0.35, cy-wireH); ctx.lineTo(dx+dw*0.65, cy-wireH); ctx.lineTo(dx+dw*0.65, cy); ctx.stroke();
  ctx.fillStyle='rgba(12,12,34,.95)'; ctx.fillRect(dx+dw*0.65-15, cy-wireH-8, 30, 15);
  ctx.strokeStyle='rgba(255,190,11,.8)'; ctx.lineWidth=1.4; ctx.strokeRect(dx+dw*0.65-15, cy-wireH-8, 30, 15);
  ctx.fillStyle='#ffbe0b'; ctx.font='9px Inter,sans-serif'; ctx.textAlign='center';
  ctx.fillText('R_L', dx+dw*0.65, cy-wireH+2);
  // electron flow direction arrow on wire
  ctx.fillStyle='#00f0ff'; ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='right';
  ctx.fillText('I = '+(ph.Iop*1000).toFixed(1)+' mA', dx+dw*0.28, cy-(stack?26:40));

  // carrier legend under the device (desktop only — stacked layout is space-constrained)
  if(!stack){
    const ley = ly+22;
    ctx.textAlign='left'; ctx.font='9px Inter,sans-serif';
    ctx.fillStyle='rgba(0,240,255,.9)'; ctx.beginPath(); ctx.arc(dx+4, ley-3, 3, 0, 6.29); ctx.fill();
    ctx.fillStyle='rgba(232,232,255,.55)'; ctx.fillText('e⁻ → n-side', dx+12, ley);
    ctx.strokeStyle='rgba(255,94,98,.9)'; ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.arc(dx+96, ley-3, 3, 0, 6.29); ctx.stroke();
    ctx.fillStyle='rgba(232,232,255,.55)'; ctx.fillText('h⁺ → p-side', dx+104, ley);
    ctx.fillStyle='rgba(232,232,255,.4)';
    ctx.fillText('E_bi sweeps pairs apart', dx+180, ley);
  }

  // ================= I–V + POWER =================
  const ix0 = stack ? 40 : devW+46, ix1 = stack ? w-30 : w-78;
  const iy0 = stack ? Math.max(ly+52, h*0.62) : 52, iy1 = h-34;
  if(ix1-ix0 < 120) return;
  const tight = (ix1-ix0) < 470 || (iy1-iy0) < 210;
  ctx.fillStyle='rgba(8,8,26,.45)'; ctx.fillRect(ix0,iy0,ix1-ix0,iy1-iy0);
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1; ctx.strokeRect(ix0,iy0,ix1-ix0,iy1-iy0);

  const Voc = Math.max(ph.Voc,0.05), Isc = Math.max(ph.IL,1e-6);
  const VX = V => ix0 + V/Voc*(ix1-ix0);
  const IY = I => iy1 - I/Isc*(iy1-iy0);
  // power curve shares the box but is normalised to its own peak (labelled separately)
  const PY = P => iy1 - P/Math.max(ph.Pmax,1e-9)*(iy1-iy0)*0.88;

  // Isc·Voc reference outline = denominator of the fill factor
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.setLineDash([4,6]); ctx.lineWidth=1.2;
  ctx.strokeRect(ix0, IY(Isc)+1, VX(Voc)-ix0-1, iy1-IY(Isc)-1); ctx.setLineDash([]);
  if(!tight){
    ctx.fillStyle='rgba(232,232,255,.42)'; ctx.font='9px Inter,sans-serif'; ctx.textAlign='left';
    ctx.fillText('I_sc × V_oc', ix0+8, iy1-12);
  }

  // Pmax rectangle = numerator of the fill factor
  ctx.fillStyle='rgba(0,255,136,.16)';
  ctx.fillRect(ix0, IY(ph.Imp), VX(ph.Vmp)-ix0, iy1-IY(ph.Imp));
  ctx.strokeStyle='rgba(0,255,136,.9)'; ctx.lineWidth=1.8;
  ctx.strokeRect(ix0, IY(ph.Imp), VX(ph.Vmp)-ix0, iy1-IY(ph.Imp));

  // I–V curve
  ctx.beginPath();
  for(let i=0;i<=200;i++){
    const V = Voc*i/200;
    const I = Math.max(ph.IL - ph.I0*(Math.exp(clamp(V/Math.max(ph.kT,0.005),-40,40))-1), 0);
    const px=VX(V), py=IY(I);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.strokeStyle='#00f0ff'; ctx.lineWidth=3; ctx.shadowColor='#00f0ff'; ctx.shadowBlur=10; ctx.stroke(); ctx.shadowBlur=0;

  // power curve
  ctx.beginPath();
  for(let i=0;i<=200;i++){
    const V = Voc*i/200;
    const I = Math.max(ph.IL - ph.I0*(Math.exp(clamp(V/Math.max(ph.kT,0.005),-40,40))-1), 0);
    const P = V*I;
    const px=VX(V), py=PY(P);
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.strokeStyle='rgba(0,255,136,.95)'; ctx.setLineDash([7,4]); ctx.lineWidth=2.2; ctx.stroke(); ctx.setLineDash([]);

  // key points
  const dot=(x,y,col,label,dxs2=8,dys2=3)=>{
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,5,0,6.29); ctx.fill();
    ctx.fillStyle=col; ctx.font='bold 10px Inter,sans-serif'; ctx.textAlign='left';
    ctx.fillText(label, x+dxs2, y+dys2);
  };
  dot(ix0, IY(Isc), '#00f0ff', 'I_sc', 6, 14);
  dot(VX(Voc), iy1, '#ffbe0b', 'V_oc', tight ? -6 : -40, tight ? -26 : 12);
  dot(VX(ph.Vmp), IY(ph.Imp), '#00ff88', 'MPP', 8, -8);
  if(!tight){
    ctx.fillStyle='rgba(0,255,136,.95)'; ctx.font='bold 10px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillText('P_max = '+(ph.Pmax*1000).toFixed(2)+' mW', ix0+8, IY(ph.Imp)+16);
  }

  // operating point
  const opx=VX(ph.Vop), opy=IY(ph.Iop);
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const g=ctx.createRadialGradient(opx,opy,0,opx,opy,16);
  g.addColorStop(0,'rgba(255,190,11,.95)'); g.addColorStop(1,'rgba(255,190,11,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(opx,opy,16,0,6.29); ctx.fill(); ctx.restore();
  ctx.fillStyle='#ffbe0b'; ctx.beginPath(); ctx.arc(opx,opy,6,0,6.29); ctx.fill();

  // axis ticks + labels
  ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='9px JetBrains Mono,monospace'; ctx.textAlign='center';
  for(let f=0;f<=1.001;f+=0.25) ctx.fillText((f*Voc).toFixed(2), VX(Voc*f), iy1+14);
  ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=1;
  for(let f=0;f<=1.001;f+=0.25){ ctx.beginPath(); ctx.moveTo(VX(Voc*f),iy1); ctx.lineTo(VX(Voc*f),iy1+4); ctx.stroke(); }
  ctx.fillStyle='rgba(232,232,255,.6)'; ctx.font='10px Inter,sans-serif'; ctx.textAlign='right';
  ctx.fillText('voltage V (V) →', ix1, iy1+28);
  ctx.textAlign='left';
  ctx.fillText('current I ↑', ix0+6, iy0-8);
  if(!tight){
    ctx.textAlign='center';
    ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='9px Inter,sans-serif';
    ctx.fillText('operating point (R_L)', (ix0+ix1)/2, iy1+28);
  }
  // right-hand axis for power (dashed green) — needs margin, so desktop only
  if(!stack){
    ctx.fillStyle='rgba(0,255,136,.5)'; ctx.font='9px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillText((ph.Pmax*1000).toFixed(1)+' mW', ix1+6, iy1);
    ctx.fillText('0', ix1+6, iy0+10);
    ctx.save(); ctx.translate(ix1+34,(iy0+iy1)/2); ctx.rotate(-Math.PI/2);
    ctx.fillStyle='rgba(0,255,136,.55)'; ctx.textAlign='center'; ctx.fillText('power (norm.)', 0, 0); ctx.restore();
  }

  const lgy = iy1-40, lgx = ix0+12;
  if(!tight){
  ctx.textAlign='left'; ctx.font='bold 9px Inter,sans-serif';
  ctx.fillStyle='rgba(6,10,24,.85)'; ctx.fillRect(lgx-6, lgy-11, 128, 18);
  ctx.strokeStyle='#00f0ff'; ctx.lineWidth=2.2;
  ctx.beginPath(); ctx.moveTo(lgx, lgy); ctx.lineTo(lgx+16, lgy); ctx.stroke();
  ctx.fillStyle='rgba(0,240,255,.85)'; ctx.fillText('I(V)', lgx+20, lgy+3);
  ctx.strokeStyle='rgba(0,255,136,.9)'; ctx.setLineDash([5,3]);
  ctx.beginPath(); ctx.moveTo(lgx+52, lgy); ctx.lineTo(lgx+68, lgy); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='rgba(0,255,136,.85)'; ctx.fillText('P(V)', lgx+72, lgy+3);
  }
}

/* ============================================================
   TOPIC 7 — CONDUCTIVITY
   ============================================================ */
const t7 = { readouts:null, electrons:[], holes:[], flashes:[], time:0 };
function t7Physics(){
  const { E, mue, muh, n, p } = state.t7;
  const sigma = PHYSICS.e*(n*mue + p*muh); // S/cm
  const J = sigma*E;
  return { sigma, rho: sigma>0?1/sigma:Infinity, J, vde:mue*E, vdh:muh*E };
}
function t7Update(dt){
  t7.time += dt;
  const ph = t7Physics();
  t7.readouts.set('sigma', fmtSci(ph.sigma)+' S/cm');
  t7.readouts.set('rho', isFinite(ph.rho)?fmtSci(ph.rho)+' Ω·cm':'∞');
  t7.readouts.set('j', fmtSci(ph.J)+' A/cm²');
  t7.readouts.set('vde', fmtSci(ph.vde)+' cm/s');
  t7.readouts.set('vdh', fmtSci(ph.vdh)+' cm/s');
  const f7s = document.getElementById('f7-sigma'), f7j = document.getElementById('f7-j');
  if(f7s) f7s.innerHTML = `σ = e(nμ<sub>e</sub>+pμ<sub>h</sub>) = <span class="fv">${fmtSci(ph.sigma)}</span> S/cm`;
  if(f7j) f7j.innerHTML = `J = σE = <span class="fv">${fmtSci(ph.J)}</span> A/cm²`;
  // particles
  const E = state.t7.E;
  const driftE = clamp(E/1e4, 0, 1)*0.35;
  if(state.t7.showE && t7.electrons.length<60 && Math.random()<0.6)
    t7.electrons.push({ x:Math.random(), y:Math.random(), vx:0, vy:0 });
  if(state.t7.showH && t7.holes.length<60 && Math.random()<0.6)
    t7.holes.push({ x:Math.random(), y:Math.random(), vx:0, vy:0 });
  const thermal = state.t7.showThermal ? 0.12 : 0.01;
  t7.electrons.forEach(p=>{
    p.vx += (Math.random()-.5)*thermal*dt*8; p.vy += (Math.random()-.5)*thermal*dt*8;
    p.vx *= 0.92; p.vy *= 0.92;
    p.x += (p.vx - driftE)*dt*2; p.y += p.vy*dt*2;
    if(Math.random()<0.002) t7.flashes.push({x:p.x,y:p.y,t:0});
    if(p.x<-0.05) p.x=1.05; if(p.x>1.05) p.x=-0.05;
    if(p.y<0) p.y=0; if(p.y>1) p.y=1;
  });
  t7.holes.forEach(p=>{
    p.vx += (Math.random()-.5)*thermal*dt*8; p.vy += (Math.random()-.5)*thermal*dt*8;
    p.vx *= 0.92; p.vy *= 0.92;
    p.x += (p.vx + driftE*0.7)*dt*2; p.y += p.vy*dt*2;
    if(p.x<-0.05) p.x=1.05; if(p.x>1.05) p.x=-0.05;
    if(p.y<0) p.y=0; if(p.y>1) p.y=1;
  });
  t7.flashes.forEach(f=>f.t+=dt);
  t7.flashes = t7.flashes.filter(f=>f.t<0.3);
}
function t7Render(){
  const c = canvases['t7']; if(!c) return;
  const { ctx, w, h } = c;
  ctx.clearRect(0,0,w,h);
  const ph = t7Physics();
  const narrow7 = w < 620;
  const padL=34, padR=34, padT=64;
  const latBottom = h-132;
  const latW = w-padL-padR;
  const E = state.t7.E;

  // crystal frame
  ctx.fillStyle='rgba(255,255,255,.015)';
  ctx.fillRect(padL, padT-10, latW, latBottom-padT+10);
  ctx.strokeStyle='rgba(255,255,255,.10)'; ctx.setLineDash([6,6]); ctx.lineWidth=1;
  ctx.strokeRect(padL, padT-10, latW, latBottom-padT+10); ctx.setLineDash([]);

  // ---- lattice ----
  if(state.t7.showLattice){
    const spacing = 48;
    for(let x=padL+spacing/2; x<padL+latW-4; x+=spacing)
      for(let y=padT+spacing/2-6; y<latBottom; y+=spacing){
        const r = 4.5;
        const gg = ctx.createRadialGradient(x,y,0,x,y,r*2.2);
        gg.addColorStop(0,'rgba(150,160,210,.42)'); gg.addColorStop(1,'rgba(150,160,210,0)');
        ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(x,y,r*2.2,0,6.29); ctx.fill();
        ctx.fillStyle='rgba(150,160,210,.5)'; ctx.beginPath(); ctx.arc(x,y,r,0,6.29); ctx.fill();
      }
  }

  // ---- field arrow (top) ----
  const frac = clamp(E/1e4, 0, 1);
  const ax0 = padL+8, ay0 = 30;
  const alen = 40 + frac*(latW-120);
  ctx.strokeStyle='#ffbe0b'; ctx.lineWidth=4;
  ctx.shadowColor='#ffbe0b'; ctx.shadowBlur = 6+6*Math.sin(t7.time*3);
  ctx.beginPath(); ctx.moveTo(ax0, ay0); ctx.lineTo(ax0+alen, ay0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax0+alen,ay0); ctx.lineTo(ax0+alen-15,ay0-8); ctx.lineTo(ax0+alen-15,ay0+8);
  ctx.closePath(); ctx.fillStyle='#ffbe0b'; ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#ffbe0b'; ctx.font='bold 12px Inter,sans-serif'; ctx.textAlign='left';
  ctx.fillText('E = '+fmtSci(E)+' V/cm', ax0, ay0-14);
  if(E===0){
    ctx.fillStyle='rgba(232,232,255,.5)'; ctx.font='10px Inter,sans-serif';
    ctx.fillText('E = 0 → pure random thermal motion', ax0+alen+20, ay0+4);
  }

  // ---- velocity vectors on representative carriers ----
  const drawArrow=(x1,y1,x2,y2,col,lw)=>{
    ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const ang=Math.atan2(y2-y1,x2-x1), s=6;
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-s*Math.cos(ang-0.4), y2-s*Math.sin(ang-0.4));
    ctx.lineTo(x2-s*Math.cos(ang+0.4), y2-s*Math.sin(ang+0.4));
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  };

  // ---- collision flashes ----
  t7.flashes.forEach(f=>{
    const px=padL+f.x*latW, py=padT+f.y*(latBottom-padT);
    const a=1-f.t/0.3;
    ctx.strokeStyle=`rgba(255,255,255,${a*0.7})`; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.arc(px,py,5+f.t*26,0,6.29); ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${a*0.5})`;
    ctx.beginPath(); ctx.arc(px,py,2,0,6.29); ctx.fill();
  });

  // ---- carriers ----
  ctx.save();
  const drawElectron = (p)=>{
    const px=padL+p.x*latW, py=padT+p.y*(latBottom-padT);
    const g=ctx.createRadialGradient(px,py,0,px,py,8);
    g.addColorStop(0,'rgba(0,240,255,.75)'); g.addColorStop(1,'rgba(0,240,255,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,8,0,6.29); ctx.fill();
    ctx.fillStyle='#28f6ff'; ctx.beginPath(); ctx.arc(px,py,3.2,0,6.29); ctx.fill();
    ctx.fillStyle='rgba(4,10,24,.9)'; ctx.font='bold 7px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText('−', px, py+2.6);
  };
  const drawHole = (p)=>{
    const px=padL+p.x*latW, py=padT+p.y*(latBottom-padT);
    const g=ctx.createRadialGradient(px,py,0,px,py,8);
    g.addColorStop(0,'rgba(255,94,98,.55)'); g.addColorStop(1,'rgba(255,94,98,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,8,0,6.29); ctx.fill();
    ctx.strokeStyle='#ff5e62'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(px,py,4,0,6.29); ctx.stroke();
    ctx.fillStyle='rgba(255,94,98,1)'; ctx.font='bold 8px Inter,sans-serif'; ctx.textAlign='center';
    ctx.fillText('+', px, py+2.8);
  };
  t7.electrons.forEach(drawElectron);
  t7.holes.forEach(drawHole);
  ctx.restore();

  // representative drift-velocity vectors
  if(state.t7.showVectors && E>0){
    // representative drift-velocity vectors, drawn inside the crystal on a clear row
    const ay = latBottom - 26;
    const vlen = clamp(ph.vde/1e7,0,1)*(narrow7?26:44) + 14;
    const hl = clamp(ph.vdh/1e7,0,1)*(narrow7?26:44) + 14;
    const ex = padL + latW*0.22, hx = padL + latW*0.62;
    // electrons drift opposite to E (to the left); holes drift along E (to the right)
    drawArrow(ex, ay, ex-vlen, ay, 'rgba(0,240,255,1)', 3);
    drawArrow(hx, ay, hx+hl, ay, 'rgba(255,94,98,1)', 3);
    ctx.font='bold 9px JetBrains Mono,monospace'; ctx.textAlign='left';
    ctx.fillStyle='#00f0ff'; ctx.fillText('v_d(e)', ex-vlen, ay+14);
    ctx.fillStyle='#ff5e62'; ctx.fillText('v_d(h)', hx+hl, ay+14);
  }

  // ---- legend line ----
  ctx.textAlign='left'; ctx.font='bold 10px Inter,sans-serif';
  ctx.fillStyle='#00f0ff'; ctx.fillText('e⁻  drift ∥ −E', padL, latBottom+26);
  ctx.fillStyle='#ff5e62'; ctx.fillText('h⁺  drift ∥ +E', padL+(narrow7?104:124), latBottom+26);
  if(!narrow7){
    ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='10px Inter,sans-serif';
    ctx.fillText(state.t7.showThermal ? 'incl. random thermal walk + scattering' : 'drift only', padL+250, latBottom+26);
  }

  // ---- current-density split bar ----
  const by = latBottom+38, bh = 22, bw = latW;
  const Je = PHYSICS.e*state.t7.n*state.t7.mue*E;
  const Jh = PHYSICS.e*state.t7.p*state.t7.muh*E;
  const Jtot = Je+Jh;
  const fracE = Jtot>0 ? Je/Jtot : 0.5;
  ctx.fillStyle='rgba(0,240,255,.85)'; ctx.fillRect(padL,by,bw*fracE,bh);
  ctx.fillStyle='rgba(255,94,98,.85)'; ctx.fillRect(padL+bw*fracE,by,bw*(1-fracE),bh);
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=1.6; ctx.strokeRect(padL,by,bw,bh);
  ctx.font='bold 10px JetBrains Mono,monospace';
  if(fracE>0.14){ ctx.fillStyle='rgba(4,10,24,.9)'; ctx.textAlign='left'; ctx.fillText('J_e', padL+8, by+15); }
  if(1-fracE>0.14){ ctx.fillStyle='rgba(4,10,24,.9)'; ctx.textAlign='right'; ctx.fillText('J_h', padL+bw-8, by+15); }
  ctx.textAlign='center'; ctx.fillStyle='rgba(232,232,255,.85)'; ctx.font='bold 10px Inter,sans-serif';
  ctx.fillText('J = J_e + J_h = '+fmtSci(Jtot)+' A/cm²', padL+bw/2, by+bh+16);

  // ---- sigma highlight ----
  ctx.textAlign='right'; ctx.font='bold 11px JetBrains Mono,monospace'; ctx.fillStyle='#00ff88';
  ctx.fillText('σ = '+fmtSci(ph.sigma)+' S/cm', w-34, 34);
  ctx.fillStyle='rgba(232,232,255,.45)'; ctx.font='9px Inter,sans-serif';
  ctx.fillText('ρ = '+(isFinite(ph.rho)?fmtSci(ph.rho)+' Ω·cm':'∞'), w-34, 48);
}

    buildSlider(box, { label:'Electric Field (E)', id:'t7-E', min:0, max:10000, step:10, value:state.t7.E, format:v=>fmtSci(v)+' V/cm',

    buildSlider(box, { label:'Electron Concentration n (log)', id:'t7-n', min:14, max:18, step:0.05, value:16, format:v=>'10'+sup(v.toFixed(1))+' cm⁻³',
      onInput:v=>state.t7.n=Math.pow(10,v) });
    buildSlider(box, { label:'Hole Concentration p (log)', id:'t7-p', min:14, max:18, step:0.05, value:16, format:v=>'10'+sup(v.toFixed(1))+' cm⁻³',
      onInput:v=>state.t7.p=Math.pow(10,v) });
    buildToggle(box, { label:'Show electrons', checked:true, onChange:v=>state.t7.showE=v });
    buildToggle(box, { label:'Show holes', checked:true, onChange:v=>state.t7.showH=v });
    buildToggle(box, { label:'Show lattice', checked:true, onChange:v=>state.t7.showLattice=v });
    buildToggle(box, { label:'Show drift vectors', checked:true, onChange:v=>state.t7.showVectors=v });
    buildToggle(box, { label:'Show random thermal motion', checked:true, onChange:v=>state.t7.showThermal=v });
    t7.readouts = buildReadouts(box, [
      { id:'sigma', label:'σ Conductivity', color:'#00f0ff', wide:true },
      { id:'rho', label:'ρ = 1/σ', color:'#ffbe0b' },
      { id:'j', label:'J = σE', color:'#ff006e' },
      { id:'vde', label:'v_d (e⁻)', color:'#00f0ff' },
      { id:'vdh', label:'v_d (h⁺)', color:'#ff5e62' },
    ]);
    document.getElementById('formula-t7').innerHTML = `
      <span class="formula" id="f7-sigma">σ = e(nμ<sub>e</sub>+pμ<sub>h</sub>)</span>
      <span class="formula" id="f7-j">J = σE</span>
      <span class="formula">v<sub>d</sub> = μE</span>`;
  }
}

/* ============================================================
   ANIMATION ENGINE
   ============================================================ */
let lastTime = performance.now();
function animate(){
  const now = performance.now();
  const dt = Math.min((now-lastTime)/1000, 0.05);
  lastTime = now;
  const upd = { t1:t1Update, t2:t2Update, t3:t3Update, t4:t4Update, t5:t5Update, t6:t6Update, t7:t7Update };
  const ren = { t1:t1Render, t2:t2Render, t3:t3Render, t4:t4Render, t5:t5Render, t6:t6Render, t7:t7Render };
  if(upd[activeTopic]) upd[activeTopic](dt);
  if(ren[activeTopic]) ren[activeTopic]();
  requestAnimationFrame(animate);
}

document.getElementById('themeBtn').addEventListener('click', ()=>{
  document.body.classList.toggle('light');
  document.getElementById('themeBtn').textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
});
document.getElementById('fsBtn').addEventListener('click', ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
});

   INIT
   ============================================================ */
buildPanels();
buildControls();
for(const t of TOPICS){
  const inner = document.querySelector('#accordion-'+t.id+' .accordion-body-inner');
  if(inner) inner.innerHTML = THEORY[t.id];
}
switchTopic('t1');
requestAnimationFrame(()=>{
  for(const t of TOPICS){
    const cv = document.getElementById('cv-'+t.id);
    if(cv) canvases[t.id] = setupCanvas(cv);
  }
  refreshCanvases();
  requestAnimationFrame(animate);
});
